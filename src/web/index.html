<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="까치" />
<meta name="theme-color" content="#fcfcfd" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/favicon.png" type="image/png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css" />
<title>까치</title>
<style>
  /* Tokens: see DESIGN.md. Color in OKLCH; accent is the teal sheen of a magpie's wing. */
  :root {
    --bg: oklch(0.992 0.002 240);
    --surface: oklch(0.962 0.005 240);
    --line: oklch(0.905 0.007 240);
    --text: oklch(0.22 0.012 250);
    --muted: oklch(0.49 0.014 250);
    --accent: oklch(0.54 0.105 192);
    --accent-soft: oklch(0.948 0.03 192);
    --accent-ring: oklch(0.54 0.105 192 / .35);
    --danger: oklch(0.53 0.17 35);
    --button: var(--text);
    --button-ink: var(--bg);
    --shadow: 0 1px 2px oklch(0.2 0.02 250 / .12);

    --font: "SUIT Variable", "Apple SD Gothic Neo", sans-serif;
    --t-sm: 13px; --t-base: 16px; --t-md: 19px; --t-lg: 23px;   /* ratio 1.2 */
    --r-sm: 8px; --r-md: 14px; --r-pill: 999px;
    --ease-out: cubic-bezier(.22, 1, .36, 1);
    --dur-fast: 120ms; --dur: 200ms;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme=light]) {
      --bg: oklch(0.185 0.006 250);
      --surface: oklch(0.235 0.008 250);
      --line: oklch(0.31 0.01 250);
      --text: oklch(0.94 0.005 250);
      --muted: oklch(0.71 0.012 250);
      --accent: oklch(0.76 0.095 190);
      --accent-soft: oklch(0.3 0.045 192);
      --accent-ring: oklch(0.76 0.095 190 / .4);
      --danger: oklch(0.74 0.13 40);
      --shadow: none;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font); font-size: var(--t-base);
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    caret-color: var(--accent);
  }
  ::selection { background: var(--accent-soft); color: var(--text); }
  button { font-family: inherit; }
  :focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-ring); }

  /* header */
  .bar {
    display: grid; grid-template-columns: 44px 1fr 44px; align-items: center;
    padding: calc(6px + env(safe-area-inset-top)) 8px 4px;
  }
  .brand { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: var(--t-base); }
  .brand img { width: 24px; height: 24px; border-radius: 6px; }
  .icon-btn {
    width: 44px; height: 44px; border: 0; border-radius: var(--r-md); background: transparent; color: var(--muted);
    display: grid; place-items: center; cursor: pointer;
    transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  }
  .icon-btn svg { width: 22px; height: 22px; }
  @media (hover: hover) { .icon-btn:hover { background: var(--surface); color: var(--text); } }
  .icon-btn:active { background: var(--line); color: var(--text); }

  /* transcript */
  #log {
    flex: 1; overflow-y: auto; padding: 16px 20px 8px; display: flex; flex-direction: column; gap: 28px;
    scrollbar-width: thin; scrollbar-color: var(--line) transparent;
  }
  .turn { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 640px; margin: 0 auto; }
  .you {
    align-self: flex-end; max-width: 85%; background: var(--surface); padding: 10px 14px;
    border-radius: var(--r-md) var(--r-md) 4px var(--r-md);
    font-size: var(--t-base); line-height: 1.5; word-break: keep-all; overflow-wrap: anywhere;
  }
  .kkachi { font-size: var(--t-md); line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; max-width: 34em; }
  .kkachi .live { white-space: pre-wrap; }
  .kkachi.error { color: var(--danger); }

  /* live progress: typing dots, and what Kkachi is doing right now */
  .dots { display: inline-flex; gap: 4px; align-items: center; height: 1em; vertical-align: middle; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .3; animation: dot 1.2s var(--ease-out) infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 30% { opacity: 1; transform: translateY(-2px); } 60%, 100% { opacity: .3; transform: none; } }
  .you.pending { color: var(--muted); padding: 13px 16px; }
  .working { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: var(--t-sm); min-height: 1.6em; }
  .working[hidden] { display: none; }
  .working .dots { color: var(--accent); }
  .working .label:empty { display: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips:empty { display: none; }
  .chip { font-size: var(--t-sm); color: var(--muted); background: var(--surface); border-radius: var(--r-sm); padding: 4px 9px; }
  .chip.changed { color: var(--accent); background: var(--accent-soft); font-weight: 600; }

  /* first run: real things to say, near where you talk */
  .intro { margin-top: auto; width: 100%; max-width: 640px; margin-inline: auto; padding-bottom: 8px; }
  .intro h1 { font-size: var(--t-lg); font-weight: 700; letter-spacing: -0.015em; margin: 0 0 14px; line-height: 1.3; }
  /* examples are things to say, not buttons: plain quoted lines, no tappable-looking boxes */
  .intro ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .intro li { font-size: var(--t-md); line-height: 1.45; color: var(--muted); }
  .intro p { font-size: var(--t-sm); color: var(--muted); margin: 14px 0 0; line-height: 1.5; }

  /* talk area: everything below the transcript is the press target */
  #talk {
    touch-action: none; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 12px 20px calc(16px + env(safe-area-inset-bottom));
  }
  #status { font-size: var(--t-sm); color: var(--muted); min-height: 1.4em; text-align: center; }
  body[data-state=recording] #status { color: var(--accent); font-weight: 600; }
  body[data-state=error] #status { color: var(--danger); }
  #mic {
    position: relative; width: 72px; height: 72px; border-radius: var(--r-pill); border: 0; cursor: pointer;
    background: var(--button); color: var(--button-ink); display: grid; place-items: center; box-shadow: var(--shadow);
    transition: transform var(--dur) var(--ease-out), background-color var(--dur) var(--ease-out), opacity var(--dur) var(--ease-out);
  }
  #mic svg { width: 26px; height: 26px; }
  @media (hover: hover) { #mic:hover { opacity: .88; } }
  #mic:disabled { opacity: .35; cursor: not-allowed; }
  /* signature: the voice-level ring while you hold */
  #mic::before {
    content: ""; position: absolute; inset: -7px; border-radius: inherit; border: 3px solid var(--accent);
    opacity: 0; transform: scale(calc(1 + var(--level, 0) * .3));
    transition: transform 80ms linear, opacity var(--dur) var(--ease-out);
  }
  body[data-state=recording] #mic { background: var(--accent); color: oklch(0.99 0 0); transform: scale(1.06); }
  body[data-state=recording] #mic::before { opacity: .5; }
  .bars { display: none; gap: 4px; align-items: center; height: 24px; }
  .bars i { display: block; width: 4px; height: 8px; border-radius: 2px; background: currentColor; animation: bar 900ms var(--ease-out) infinite alternate; }
  .bars i:nth-child(2) { animation-delay: 150ms; } .bars i:nth-child(3) { animation-delay: 300ms; } .bars i:nth-child(4) { animation-delay: 450ms; }
  @keyframes bar { to { transform: scaleY(2.6); } }
  body[data-state=speaking] #mic .mic-icon { display: none; }
  body[data-state=speaking] #mic .bars { display: flex; }
  /* thinking: a spinning arc around the button says "working", not "disabled" */
  #mic::after {
    content: ""; position: absolute; inset: -7px; border-radius: inherit;
    border: 3px solid transparent; border-top-color: var(--accent); opacity: 0;
    transition: opacity var(--dur) var(--ease-out);
  }
  body[data-state=thinking] #mic::after { opacity: 1; animation: spin 900ms linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .bars i, .dots i { animation: none; }
    .dots i { opacity: .7; }
    body[data-state=thinking] #mic::after { animation: none; border-color: var(--accent); opacity: .5; }
    #mic, #mic::before { transition-property: opacity, background-color; }
    body[data-state=recording] #mic { transform: none; }
    #mic::before { transform: none; }
  }

  /* settings sheet */
  dialog#settings {
    margin: auto 0 0; width: 100%; max-width: 100%; max-height: 88vh; border: 0; padding: 0;
    border-radius: var(--r-md) var(--r-md) 0 0; background: var(--bg); color: var(--text); overflow: auto;
  }
  @media (min-width: 640px) { dialog#settings { margin: auto; max-width: 520px; border-radius: var(--r-md); } }
  dialog#settings::backdrop { background: oklch(0.2 0.02 250 / .4); }
  dialog#settings[open] { animation: rise var(--dur) var(--ease-out); }
  @keyframes rise { from { transform: translateY(16px); } }
  @media (prefers-reduced-motion: reduce) { dialog#settings[open] { animation: none; } }
  .sheet { padding: 14px 20px calc(24px + env(safe-area-inset-bottom)); }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; }
  .sheet h2 { font-size: var(--t-md); font-weight: 700; margin: 0; }
  .sheet h3 { font-size: var(--t-sm); font-weight: 600; color: var(--muted); margin: 24px 0 8px; }
  .note { font-size: var(--t-sm); color: var(--muted); margin: 8px 0 0; line-height: 1.5; }
  .text-btn {
    border: 0; background: transparent; color: var(--accent); font-size: var(--t-base); font-weight: 700;
    padding: 10px 6px; border-radius: var(--r-sm); cursor: pointer;
  }
  .group { background: var(--surface); border-radius: var(--r-md); overflow: hidden; }
  .voice { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; }
  .voice + .voice { border-top: 1px solid var(--line); }
  .voice input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; }
  .voice .name { font-size: var(--t-base); font-weight: 600; }
  .voice .sub { display: block; font-size: var(--t-sm); color: var(--muted); margin-top: 2px; }
  .play {
    border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: var(--r-pill);
    padding: 7px 12px; font-size: var(--t-sm); cursor: pointer;
    transition: background-color var(--dur-fast) var(--ease-out);
  }
  @media (hover: hover) { .play:hover { background: var(--surface); } }
  .play:active { background: var(--line); }
  .row { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: var(--r-md); padding: 12px 14px; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  output { min-width: 4.5em; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: var(--t-sm); }
  .segment { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border-radius: var(--r-md); padding: 3px; }
  .segment label { text-align: center; padding: 10px 0; border-radius: 11px; font-size: var(--t-base); cursor: pointer; color: var(--muted); }
  .segment input { position: absolute; opacity: 0; pointer-events: none; }
  .segment label:has(input:checked) { background: var(--bg); color: var(--text); box-shadow: var(--shadow); }
  .segment label:has(input:focus-visible) { box-shadow: 0 0 0 3px var(--accent-ring); }
  select { width: 100%; font: inherit; font-size: var(--t-base); padding: 12px 14px; border-radius: var(--r-md); border: 0; background: var(--surface); color: var(--text); }
  .plain-btn {
    width: 100%; font: inherit; font-size: var(--t-base); font-weight: 600; padding: 13px; border-radius: var(--r-md);
    border: 0; background: var(--surface); color: var(--text); cursor: pointer;
    transition: background-color var(--dur-fast) var(--ease-out);
  }
  @media (hover: hover) { .plain-btn:hover { background: var(--line); } }
  .plain-btn:disabled { opacity: .5; cursor: progress; }
  .loading { padding: 14px; font-size: var(--t-sm); color: var(--muted); }

  #toast {
    position: fixed; left: 50%; top: calc(56px + env(safe-area-inset-top)); transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: var(--r-sm); font-size: var(--t-sm);
    opacity: 0; transition: opacity var(--dur) var(--ease-out); pointer-events: none; z-index: 10;
  }
  #toast.show { opacity: 1; }
  #diag { display: none; font: 11px/1.35 ui-monospace, monospace; color: var(--muted); padding: 8px 12px; max-height: 22vh; overflow: auto; white-space: pre-wrap; }
  body.debug #diag { display: block; }
</style>
</head>
<body data-state="idle">
<header class="bar">
  <button class="icon-btn" id="refresh" aria-label="새로고침">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
  </button>
  <div class="brand"><img src="/favicon.png" alt="" />까치</div>
  <button class="icon-btn" id="open-settings" aria-label="설정">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
  </button>
</header>

<main id="log" aria-live="polite"></main>

<section id="talk" aria-label="말하기">
  <div id="status">누르고 있는 동안 말하세요</div>
  <button id="mic" aria-label="누르고 있는 동안 말하기 (Space)">
    <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  </button>
</section>
<div id="toast" role="status"></div>
<div id="diag"></div>

<template id="intro-template">
  <section class="intro" id="intro">
    <h1>까치에게 이렇게 말해 보세요</h1>
    <ul>
      <li>“다음 주 금요일 저녁에 엄마랑 약속 있어”</li>
      <li>“친구 결혼식 언제였지?”</li>
      <li>“오늘 서울 날씨 어때?”</li>
    </ul>
    <p>들은 일정과 결정은 까치가 알아서 기억해요.</p>
  </section>
</template>

<dialog id="settings" aria-labelledby="settings-title">
  <form class="sheet" method="dialog">
    <div class="sheet-head">
      <h2 id="settings-title">설정</h2>
      <button class="text-btn" value="close">완료</button>
    </div>

    <h3>목소리</h3>
    <div class="group" id="voices"><div class="loading">불러오는 중…</div></div>

    <h3>말 빠르기</h3>
    <div class="row">
      <input type="range" id="rate" min="-30" max="60" step="10" aria-label="말 빠르기" />
      <output id="rate-out"></output>
    </div>

    <h3>생각 깊이</h3>
    <div class="segment" id="thinking" role="radiogroup" aria-label="생각 깊이"></div>
    <p class="note">빠르게는 답이 일찍 오고, 꼼꼼하게는 어려운 일을 더 잘해요.</p>

    <h3>모델</h3>
    <select id="model" aria-label="모델"><option>불러오는 중…</option></select>
    <p class="note" id="fallbacks"></p>

    <h3>대화</h3>
    <button type="button" class="plain-btn" id="new-conversation">새 대화 시작</button>
    <p class="note">대화 흐름만 비워요. 기억해 둔 내용은 그대로예요.</p>
  </form>
</dialog>

<script src="/app.js"></script>
</body>
</html>
