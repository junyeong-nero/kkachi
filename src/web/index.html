<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="까치" />
<meta name="theme-color" content="#172238" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet" />
<title>까치</title>
<style>
  :root {
    --night: #172238;     /* 밤하늘: page */
    --deep: #121b2e;
    --ink: #0a101c;       /* 까치 몸 */
    --feather: #eef2f5;   /* 흰 깃 */
    --dim: #8f9bb3;
    --faint: #33425f;
    --teal: #2fa3a0;      /* 날개 광택 */
    --blue: #3d6fd8;
    --violet: #7a5bd6;
    --news: #f2c14e;      /* 반가운 소식 */
    --serif: "Gowun Batang", "AppleMyungjo", serif;
    --sans: -apple-system, "Apple SD Gothic Neo", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(120% 80% at 50% 38%, #22325a 0%, var(--night) 46%, var(--deep) 100%);
    color: var(--feather); font-family: var(--sans);
    display: flex; flex-direction: column; overflow: hidden;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }

  /* top bar: two quiet controls, out of the press area */
  #bar { display: flex; justify-content: space-between; padding: calc(10px + env(safe-area-inset-top)) 14px 0; }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; color: var(--dim);
    display: grid; place-items: center; cursor: pointer;
  }
  .icon-btn:active { background: rgba(238, 242, 245, .08); color: var(--feather); }
  .icon-btn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  .icon-btn svg { width: 22px; height: 22px; }

  /* the press-to-talk area is everything below the bar */
  #stage {
    flex: 1; touch-action: none; -webkit-touch-callout: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 8px 28px calc(84px + env(safe-area-inset-bottom)); text-align: center;
  }
  #heard { font-size: 16px; color: var(--dim); min-height: 1.4em; max-width: 26em; line-height: 1.45; word-break: keep-all; }
  #bird { width: min(68vw, 300px); height: auto; overflow: visible; }
  #reply {
    font-family: var(--serif); font-size: 25px; line-height: 1.55; letter-spacing: -0.01em;
    min-height: 3.1em; max-width: 17em; text-wrap: balance; word-break: keep-all; overflow-wrap: anywhere;
  }
  #reply .quiet { color: var(--dim); }
  #chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; min-height: 30px; }
  .chip { font-size: 13px; color: var(--dim); border: 1px solid var(--faint); border-radius: 999px; padding: 5px 12px; }
  .chip.changed { color: var(--news); border-color: rgba(242, 193, 78, .45); }
  #hint {
    position: fixed; left: 0; right: 0; bottom: calc(26px + env(safe-area-inset-bottom));
    font-size: 15px; color: var(--dim); text-align: center; pointer-events: none;
  }
  body[data-state=recording] #hint { color: var(--teal); }
  body[data-state=error] #hint { color: #f08a8a; }

  /* ---- the magpie: the one bold element ---- */
  #bird .body, #bird .head { fill: var(--ink); stroke: rgba(238, 242, 245, .14); stroke-width: 1; }
  #bird .white { fill: var(--feather); }
  #bird .sheen { fill: url(#sheen); }
  #bird .branch { stroke: #3b4c6b; stroke-width: 6; stroke-linecap: round; fill: none; }
  #bird .twig { stroke: #3b4c6b; stroke-width: 3; stroke-linecap: round; fill: none; }
  #bird .legs { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; fill: none; }
  .waves path { fill: none; stroke-width: 3.2; stroke-linecap: round; opacity: 0; }
  #perch { transform-origin: 120px 120px; animation: breathe 4.5s ease-in-out infinite; }
  #head { transform-origin: 150px 76px; transition: transform .35s ease; }
  #jaw { transform-origin: 176px 64px; }
  #tail { transform-origin: 96px 110px; }
  #eye { transform-origin: 166px 56px; animation: blink 6s infinite; }
  @keyframes breathe { 50% { transform: translateY(1.2px); } }
  @keyframes blink { 0%, 95%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }

  /* listening: head up, incoming sound grows with the voice level */
  body[data-state=recording] #head { transform: rotate(-9deg); }
  body[data-state=recording] .waves { color: var(--teal); }
  body[data-state=recording] .waves path { opacity: calc(.25 + var(--level, 0) * .75); }
  body[data-state=recording] .waves path:nth-child(2) { opacity: calc(var(--level, 0) * 1.1 - .15); }
  body[data-state=recording] .waves path:nth-child(3) { opacity: calc(var(--level, 0) * 1.3 - .45); }
  /* thinking: a curious tilt */
  body[data-state=thinking] #head { animation: ponder 1.8s ease-in-out infinite; }
  @keyframes ponder { 0%, 100% { transform: rotate(7deg); } 50% { transform: rotate(-3deg); } }
  /* speaking: beak and tail move, good news goes out */
  body[data-state=speaking] #jaw { animation: chatter .32s ease-in-out infinite alternate; }
  body[data-state=speaking] #tail { animation: flick 1.4s ease-in-out infinite; }
  body[data-state=speaking] .waves { color: var(--news); }
  body[data-state=speaking] .waves path { animation: outward 1.2s ease-out infinite; }
  body[data-state=speaking] .waves path:nth-child(2) { animation-delay: .2s; }
  body[data-state=speaking] .waves path:nth-child(3) { animation-delay: .4s; }
  @keyframes chatter { to { transform: rotate(16deg); } }
  @keyframes flick { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-5deg); } }
  @keyframes outward { 0% { opacity: 0; } 30% { opacity: .9; } 100% { opacity: 0; } }
  body[data-state=error] #head { transform: rotate(14deg); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* ---- settings sheet: white like the magpie's belly ---- */
  dialog#settings {
    margin: auto 0 0; width: 100%; max-width: 100%; max-height: 88vh; border: 0; padding: 0;
    border-radius: 22px 22px 0 0; background: var(--feather); color: var(--ink); overflow: auto;
    font-family: var(--sans);
  }
  dialog#settings::backdrop { background: rgba(10, 16, 28, .55); }
  dialog#settings[open] { animation: rise .22s ease-out; }
  @keyframes rise { from { transform: translateY(30px); opacity: .6; } }
  .sheet { padding: 18px 20px calc(24px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  .sheet header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .sheet h1 { font-family: var(--serif); font-size: 22px; margin: 0; }
  .sheet h2 { font-size: 15px; font-weight: 600; margin: 22px 0 8px; }
  .sheet p.note { font-size: 13px; color: #5b6479; margin: 6px 0 0; line-height: 1.45; }
  .text-btn { border: 0; background: transparent; color: var(--blue); font-size: 16px; padding: 8px 4px; cursor: pointer; }
  .voices { display: grid; gap: 6px; }
  .voice {
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 12px; background: #fff; border: 1.5px solid transparent;
  }
  .voice:has(input:checked) { border-color: var(--blue); }
  .voice input { accent-color: var(--blue); width: 18px; height: 18px; margin: 0; }
  .voice .name { font-size: 16px; }
  .voice .sub { display: block; font-size: 13px; color: #5b6479; margin-top: 2px; }
  .play { border: 1px solid #c9d1de; background: #fff; color: var(--ink); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .row { display: flex; align-items: center; gap: 12px; }
  input[type=range] { flex: 1; accent-color: var(--blue); }
  output { min-width: 4.5em; text-align: right; font-variant-numeric: tabular-nums; color: #5b6479; }
  .segment { display: grid; grid-template-columns: repeat(3, 1fr); background: #dde3ec; border-radius: 12px; padding: 3px; }
  .segment label { text-align: center; padding: 9px 0; border-radius: 9px; font-size: 15px; cursor: pointer; }
  .segment input { position: absolute; opacity: 0; pointer-events: none; }
  .segment label:has(input:checked) { background: #fff; box-shadow: 0 1px 2px rgba(10, 16, 28, .12); }
  select { width: 100%; font-size: 16px; padding: 11px 12px; border-radius: 12px; border: 1px solid #c9d1de; background: #fff; color: var(--ink); }
  .danger { width: 100%; font-size: 16px; padding: 12px; border-radius: 12px; border: 1px solid #c9d1de; background: #fff; color: var(--ink); cursor: pointer; }
  #toast {
    position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top)); transform: translateX(-50%);
    background: var(--feather); color: var(--ink); padding: 9px 16px; border-radius: 999px; font-size: 14px;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
  #diag { display: none; font: 11px/1.35 ui-monospace, monospace; color: #6b7285; padding: 8px 12px; max-height: 26vh; overflow: auto; white-space: pre-wrap; }
  body.debug #diag { display: block; }
</style>
</head>
<body data-state="idle">
<nav id="bar">
  <button class="icon-btn" id="refresh" aria-label="새로고침">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
  </button>
  <button class="icon-btn" id="open-settings" aria-label="설정">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
  </button>
</nav>

<main id="stage">
  <div id="heard"></div>
  <svg id="bird" viewBox="0 0 240 180" role="img" aria-label="까치">
    <defs>
      <linearGradient id="sheen" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#2fa3a0" />
        <stop offset=".55" stop-color="#3d6fd8" />
        <stop offset="1" stop-color="#7a5bd6" />
      </linearGradient>
    </defs>
    <path class="branch" d="M8 142 C 60 132, 120 136, 232 124" />
    <path class="twig" d="M168 130 C 178 120, 186 114, 200 110" />
    <g id="perch">
      <path class="legs" d="M118 117 L 114 136 M 130 116 L 128 134" />
      <path id="tail" class="sheen" d="M96 104 L 24 160 Q 26 169 37 166 L 106 116 Z" />
      <path class="body" d="M88 108 C 86 84, 110 66, 142 68 C 164 70, 172 86, 166 100 C 158 118, 118 126, 88 108 Z" />
      <path class="white" d="M130 112 C 148 110, 161 101, 166 92 C 168 106, 158 118, 138 121 C 129 122, 124 118, 130 112 Z" />
      <path class="sheen" d="M94 101 C 106 81, 130 75, 148 83 C 138 99, 116 109, 94 101 Z" />
      <path class="white" d="M108 87 C 118 81, 132 80, 140 83 C 130 89, 118 91, 108 87 Z" />
      <g id="head">
        <circle class="head" cx="160" cy="60" r="16" />
        <path class="head" d="M174 55 L 197 61 L 175 64 Z" />
        <path id="jaw" class="head" d="M175 64 L 192 64.5 L 175 68 Z" />
        <g id="eye"><circle cx="166" cy="56" r="2.8" fill="#eef2f5" /><circle cx="166.8" cy="56" r="1.4" fill="#0a101c" /></g>
        <g class="waves" stroke="currentColor">
          <path d="M206 50 Q 213 60 206 70" />
          <path d="M214 43 Q 225 60 214 77" />
          <path d="M222 36 Q 237 60 222 84" />
        </g>
      </g>
    </g>
  </svg>
  <div id="reply"></div>
  <div id="chips"></div>
</main>
<div id="hint">누르고 있는 동안 말하세요</div>
<div id="toast" role="status"></div>
<div id="diag"></div>

<dialog id="settings" aria-label="설정">
  <form class="sheet" method="dialog">
    <header>
      <h1>설정</h1>
      <button class="text-btn" value="close">닫기</button>
    </header>

    <h2>목소리</h2>
    <div class="voices" id="voices"></div>

    <h2>말 빠르기</h2>
    <div class="row">
      <input type="range" id="rate" min="-30" max="60" step="10" aria-label="말 빠르기" />
      <output id="rate-out"></output>
    </div>

    <h2>생각 깊이</h2>
    <div class="segment" id="thinking" role="radiogroup" aria-label="생각 깊이"></div>
    <p class="note">빠르게는 답이 일찍 오고, 꼼꼼하게는 어려운 일을 더 잘해요.</p>

    <h2>모델</h2>
    <select id="model" aria-label="모델"></select>
    <p class="note" id="fallbacks"></p>

    <h2>대화</h2>
    <button type="button" class="danger" id="new-conversation">새 대화 시작</button>
    <p class="note">지금까지 나눈 대화 흐름만 비워요. 기억해 둔 내용은 그대로 남아요.</p>
  </form>
</dialog>

<script src="/app.js"></script>
</body>
</html>
