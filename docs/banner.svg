<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" font-family="SUIT Variable, Apple SD Gothic Neo, Malgun Gothic, Segoe UI, sans-serif">
  <!-- Source for docs/banner.png (README header). Render: see DESIGN.md, Docs images. -->
  <defs>
    <style>
      @import url("https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css");
      .text { fill: #161b20; }
      .muted { fill: #5b6168; }
    </style>
    <clipPath id="icon"><rect x="568" y="48" width="144" height="144" rx="32"/></clipPath>
  </defs>

  <rect width="1280" height="400" fill="#f0f3f5"/>

  <!-- the logo, large; the name; one line -->
  <image href="../src/web/icon.png" x="568" y="48" width="144" height="144" clip-path="url(#icon)"/>
  <text x="640" y="272" text-anchor="middle" font-size="60" font-weight="800" class="text">Kkachi<tspan dx="16" font-size="30" font-weight="600" class="muted">까치</tspan></text>
  <text x="640" y="330" text-anchor="middle" font-size="27" font-weight="600" class="text">An agent that stays home: call it from anywhere.</text>
</svg>
