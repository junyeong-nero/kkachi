<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 320" width="1280" height="320" font-family="SUIT Variable, Apple SD Gothic Neo, Malgun Gothic, Segoe UI, sans-serif">
  <rect width="1280" height="320" fill="#eef6f4"/>
  <!-- the magpie's wing teal, as a quiet band (DESIGN.md: teal means listening or remembered) -->
  <rect x="0" y="312" width="1280" height="8" fill="#1f8a80"/>

  <image x="96" y="72" width="64" height="64" xlink:href="data:image/png;base64,"/>
  <text x="180" y="122" font-size="52" font-weight="800" fill="#1d232b">Kkachi</text>
  <text x="372" y="122" font-size="26" font-weight="600" fill="#5a6470">까치</text>

  <text x="96" y="194" font-size="30" font-weight="700" fill="#1d232b">Your own assistant, on your phone and around your home.</text>
  <text x="96" y="232" font-size="18" fill="#3a434e">Talk or type. It remembers in your own notes, and speaks, sees and listens through the spare phones in each room.</text>

  <g font-size="14" font-weight="700" fill="#1f8a80">
    <rect x="96" y="256" width="118" height="32" rx="16" fill="#ffffff" stroke="#b7dcd6"/><text x="155" y="277" text-anchor="middle">Self-hosted</text>
    <rect x="224" y="256" width="92" height="32" rx="16" fill="#ffffff" stroke="#b7dcd6"/><text x="270" y="277" text-anchor="middle">Pi agent</text>
    <rect x="326" y="256" width="118" height="32" rx="16" fill="#ffffff" stroke="#b7dcd6"/><text x="385" y="277" text-anchor="middle">MCP plugins</text>
    <rect x="454" y="256" width="124" height="32" rx="16" fill="#ffffff" stroke="#b7dcd6"/><text x="516" y="277" text-anchor="middle">Notes in git</text>
    <rect x="588" y="256" width="124" height="32" rx="16" fill="#ffffff" stroke="#b7dcd6"/><text x="650" y="277" text-anchor="middle">Tailnet only</text>
  </g>
</svg>
