<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1010" width="1500" height="1010" font-family="SUIT Variable, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6470"/></marker>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f8a80"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d7fae"/></marker>
    <style>
      .h { font-size: 15px; font-weight: 700; fill: #1d232b; }
      .t { font-size: 13px; fill: #3a434e; }
      .m { font-size: 12px; fill: #6b7480; }
      .col { font-size: 13px; font-weight: 700; fill: #6b7480; letter-spacing: .04em; }
      .box { fill: #ffffff; stroke: #d5dbe1; stroke-width: 1.2; }
      .sub { fill: #f3f5f7; }
      .core { fill: #f7f9fa; stroke: #b9c2cb; stroke-width: 1.4; }
      .svc { fill: #f2f7fb; stroke: #3d7fae; stroke-width: 1.4; }
      .teal { fill: #e6f3f1; stroke: #1f8a80; stroke-width: 1.2; }
      .badge { font-size: 11px; font-weight: 700; }
      .ln { stroke: #5b6470; stroke-width: 1.6; fill: none; }
      .lt { stroke: #1f8a80; stroke-width: 2.2; fill: none; }
      .lb { stroke: #3d7fae; stroke-width: 2.2; fill: none; }
      .ld { stroke: #5b6470; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect width="1500" height="1010" fill="#fcfcfd"/>
  <text x="30" y="42" font-size="24" font-weight="800" fill="#1d232b">까치 구조</text>
  <text x="30" y="66" class="m">위: 접속하는 쪽, 각자 붙는 곳 바로 위에 · 아래: core 와 MCP 서비스</text>
  <path d="M996 62 H1026" class="lt"/><text x="1032" y="66" class="m">까치 홈 (개인)</text>
  <path d="M1130 62 H1160" class="lb"/><text x="1166" y="66" class="m">기기</text>
  <path d="M1220 62 H1250" class="ln"/><text x="1256" y="66" class="m">MCP · 요청</text>
  <path d="M1340 62 H1370" class="ld"/><text x="1376" y="66" class="m">core 전용 (git_*)</text>

  <!-- ===== 접속하는 쪽 ===== -->
  <text x="30" y="96" class="col">접속하는 쪽</text>

  <rect x="30" y="106" width="530" height="134" rx="14" class="teal"/>
  <text x="48" y="132" class="h">까치 홈</text>
  <rect x="432" y="116" width="114" height="22" rx="11" fill="#1f8a80"/><text x="489" y="131" class="badge" fill="#fff" text-anchor="middle">개인 · 전체 권한</text>
  <text x="48" y="158" class="t">글 · 받아쓰기 · 사진 첨부 → 답 스트리밍 · 출처 칩 · 소리로 읽기</text>
  <text x="48" y="180" class="t"><tspan font-weight="700">대화</tspan> 집 밖에서도 · <tspan font-weight="700">기기</tspan> 방을 들여다보기 · 까치에게 열기</text>
  <text x="48" y="202" class="t"><tspan font-weight="700">설정</tspan> 외형 · 소리 · 모델 · MCP</text>
  <text x="48" y="226" class="m">core 에 붙음 · chat 에이전트</text>

  <rect x="600" y="106" width="540" height="134" rx="14" fill="#eef5fa" stroke="#3d7fae" stroke-width="1.2"/>
  <text x="618" y="132" class="h">기기: 안 쓰는 폰 · 태블릿 (/device)</text>
  <rect x="1060" y="116" width="66" height="22" rx="11" fill="#dce9f3"/><text x="1093" y="131" class="badge" fill="#2a5f86" text-anchor="middle">설정대로</text>
  <text x="618" y="158" class="t">탭해서 시작(소리 · 화면 유지 · 권한) · 화면에는 상태와 기록만</text>
  <text x="618" y="180" class="t"><tspan font-weight="700">출력</tspan> 스피커 · 조명    <tspan font-weight="700">입력</tspan> 음성 · 카메라 · 소리 · 센서 · 위치</text>
  <text x="618" y="202" class="t">누르고 말하기 → 사건으로 내보냄, 답은 한 문장씩 설정한 곳으로</text>
  <text x="618" y="226" class="m">kkachi-devices 에 붙음 (WebSocket) · 기기 토큰</text>

  <rect x="1180" y="106" width="290" height="134" rx="14" class="box"/>
  <text x="1198" y="132" class="h">다른 에이전트</text>
  <text x="1198" y="158" class="t">Claude Desktop · Codex · 다른 Pi</text>
  <text x="1198" y="180" class="t">MCP 클라이언트</text>
  <text x="1198" y="226" class="m">MCP 서비스에 붙음 (/mcp/*)</text>

  <!-- ===== Tailscale band ===== -->
  <rect x="30" y="256" width="1440" height="50" rx="12" fill="#eef1f4" stroke="#b9c2cb"/>
  <text x="48" y="278" class="h">Tailscale Serve · HTTPS · tailnet 전용</text>
  <text x="48" y="297" class="m">한 주소로 들어와 core 가 검사 · 서비스 몫은 그대로 넘김</text>

  <path d="M500 240 V350" class="lt" marker-end="url(#t)"/>
  <path d="M870 240 V326" class="lb" marker-end="url(#b)"/>
  <text x="880" y="322" class="m" fill="#2a5f86">WebSocket · 페이지 (core 는 중계만)</text>
  <path d="M1325 240 V318 H1160 V630 H1144" class="ln" marker-end="url(#a)"/>
  <path d="M1160 420 H1144" class="ln" marker-end="url(#a)"/>

  <!-- ===== kkachi-core ===== -->
  <text x="30" y="346" class="col">kkachi-core · 127.0.0.1:4300 · src/</text>
  <rect x="30" y="354" width="530" height="430" rx="14" class="core"/>

  <rect x="46" y="370" width="250" height="400" rx="10" class="teal"/>
  <text x="60" y="394" class="h">에이전트 루프 (Pi RPC)</text>
  <text x="60" y="420" class="t">대화 턴</text>
  <text x="60" y="440" class="m">받아쓰기 → 다듬기 → Pi → 문장별 TTS</text>
  <text x="60" y="468" class="t"><tspan font-weight="700">chat</tspan> 까치 홈의 대화</text>
  <text x="60" y="488" class="m">노트 파일 직접 편집 + MCP 도구</text>
  <text x="60" y="516" class="t"><tspan font-weight="700">기기에 한 말</tspan> 까치 홈 대화의 한 턴</text>
  <text x="60" y="536" class="m">같은 도구, 답은 들은 기기가 소리로</text>
  <text x="60" y="564" class="t"><tspan font-weight="700">사서</tspan> 노트 정리</text>
  <text x="60" y="592" class="t"><tspan font-weight="700">30분 대화 정리</tspan></text>
  <text x="60" y="612" class="m">memory 의 draft 위에서</text>
  <text x="60" y="640" class="t">턴 끝 → git_checkpoint</text>
  <text x="60" y="660" class="m">한 턴 = 커밋 하나</text>
  <text x="60" y="756" class="m">turn · port · librarian · review.ts</text>

  <rect x="308" y="370" width="238" height="112" rx="10" class="box"/>
  <text x="322" y="394" class="h">입력 버스 /api/bus/*</text>
  <text x="322" y="418" class="t">사건 접수 (id 한 번, 60초 안)</text>
  <text x="322" y="440" class="t">까치 홈 대화의 턴 · 피드 /api/feed</text>
  <text x="322" y="460" class="t">답은 한 문장씩 기기로 (device_reply)</text>

  <rect x="308" y="494" width="238" height="138" rx="10" class="box"/>
  <text x="322" y="518" class="h">MCP 브리지</text>
  <text x="322" y="542" class="t">kkachi.mcp.json: 서버 목록</text>
  <text x="322" y="562" class="t">tools/list → Pi 도구로 등록</text>
  <text x="322" y="582" class="t">에이전트별 허용 도구 · meta</text>
  <text x="322" y="602" class="m">(commit later = 턴 단위 커밋)</text>
  <text x="322" y="622" class="m">mcp-bridge.ts · pi/kkachi.ts</text>

  <rect x="308" y="644" width="238" height="126" rx="10" class="box"/>
  <text x="322" y="668" class="h">서비스 감독</text>
  <text x="322" y="692" class="t">command 로 띄우고</text>
  <text x="322" y="712" class="t">멈추면 다시 띄움</text>
  <text x="322" y="732" class="t">내부 토큰 공유</text>
  <text x="322" y="756" class="m">services.ts · memory.ts</text>

  <!-- ===== MCP 서비스 ===== -->
  <text x="600" y="346" class="col">MCP 서비스 · core 가 띄우는 독립 프로세스</text>
  <rect x="600" y="354" width="540" height="204" rx="14" class="svc"/>
  <text x="618" y="380" class="h">kkachi-devices · 127.0.0.1:4301</text>
  <text x="618" y="404" class="t">/device 페이지 · WebSocket · 페어링(허용 → 토큰) · 까치에게 열기 · 까치 홈의 읽기</text>
  <text x="618" y="430" class="t" font-weight="700">MCP 도구</text>
  <text x="618" y="452" class="t">list_devices · device_speak · device_snapshot</text>
  <text x="618" y="474" class="t">device_sound_level · device_sensors · device_light</text>
  <text x="618" y="500" class="t">음성: input → core 버스 → ack, 답은 device_reply (core 전용)</text>
  <text x="618" y="524" class="t" font-weight="700" fill="#1f8a80">사진 · 측정값은 중계만 · 저장 안 함</text>
  <text x="618" y="546" class="m">services/devices/</text>

  <rect x="600" y="574" width="540" height="210" rx="14" class="svc"/>
  <text x="618" y="600" class="h">kkachi-memory · 127.0.0.1:4302</text>
  <text x="618" y="624" class="t">git 을 아는 유일한 곳 · git 작업은 한 번에 하나씩</text>
  <text x="618" y="650" class="t" font-weight="700">에이전트용 MCP 도구</text>
  <text x="618" y="672" class="t">memory_list · search · read · write · edit · move · delete · undo</text>
  <text x="618" y="694" class="t">바꾸면 그 파일만 즉시 커밋 (meta 가 later 면 core 가 나중에 한 번에)</text>
  <text x="618" y="720" class="t" font-weight="700">core 전용 (내부 토큰)</text>
  <text x="618" y="742" class="t">git_sync · checkpoint · draft · staged · discard · changes · head</text>
  <text x="618" y="770" class="m">services/memory/</text>

  <!-- core ↔ services -->
  <path d="M546 520 C 575 520, 575 452, 596 452" class="ln" marker-end="url(#a)"/>
  <path d="M546 560 C 575 560, 575 672, 596 672" class="ln" marker-end="url(#a)"/>
  <path d="M600 500 H550" class="lb" marker-end="url(#b)"/>
  <text x="560" y="518" class="m" fill="#2a5f86">talk</text>
  <path d="M170 770 V790 H580 V742 H596" class="ld" marker-end="url(#a)"/>

  <!-- ===== 외부 ===== -->
  <text x="1180" y="346" class="col">외부 서비스</text>
  <rect x="1180" y="354" width="290" height="62" rx="12" class="box"/>
  <text x="1196" y="378" class="h">Groq</text>
  <text x="1196" y="400" class="m">받아쓰기 · 켜 두면 다듬기 ← core</text>
  <rect x="1180" y="426" width="290" height="62" rx="12" class="box"/>
  <text x="1196" y="450" class="h">Edge TTS (선택)</text>
  <text x="1196" y="472" class="m">기본은 기기 내장 목소리 · 고르면 서버가 만듦</text>
  <rect x="1180" y="498" width="290" height="62" rx="12" class="box"/>
  <text x="1196" y="522" class="h">모델 제공자 (Pi 경유)</text>
  <text x="1196" y="544" class="m">KKACHI_MODEL · 막히면 다음 ← core</text>
  <rect x="1180" y="570" width="290" height="62" rx="12" class="box"/>
  <text x="1196" y="594" class="h">Pi 확장 · 사용자 MCP</text>
  <text x="1196" y="616" class="m">웹 검색 · 브라우저 · 서브에이전트 (chat 만)</text>
  <rect x="1180" y="642" width="290" height="142" rx="12" fill="#ffffff" stroke="#b9c2cb" stroke-dasharray="6 4"/>
  <text x="1196" y="668" class="h">다른 MCP 서버 (추가 가능)</text>
  <text x="1196" y="692" class="t">Home Assistant · 캘린더 …</text>
  <text x="1196" y="714" class="t">kkachi.mcp.json 에 url 과</text>
  <text x="1196" y="734" class="t">허용할 도구만 적으면</text>
  <text x="1196" y="754" class="t">에이전트가 바로 씀</text>

  <!-- ===== 저장 ===== -->
  <rect x="30" y="796" width="530" height="66" rx="12" class="box"/>
  <text x="46" y="820" class="h">data/ (git 밖, 비공개)</text>
  <text x="46" y="844" class="m">settings · devices(토큰) · 검토 대기 대화 · pi-sessions(모델이 본 사진 포함) · mcp-tools-*.json · 로그</text>
  <rect x="600" y="796" width="540" height="66" rx="12" class="teal"/>
  <text x="618" y="820" class="h">memory 레포 · kkachi-memory</text>
  <text x="618" y="844" class="m">Markdown 노트 + git (기억의 원본) · 턴 · 변경 · 정리 · 대화 정리 = 커밋 · 사진 · 센서 값 없음</text>
  <path d="M870 784 V792" class="ln" marker-end="url(#a)"/>
  <rect x="1180" y="796" width="290" height="66" rx="12" class="box"/>
  <text x="1196" y="820" class="h">원격 (선택)</text>
  <text x="1196" y="844" class="m">GitHub · USB · NAS · 동기화를 켰을 때만</text>
  <path d="M1140 829 H1176" class="ln" marker-end="url(#a)"/>

  <!-- ===== 운영 ===== -->
  <rect x="30" y="876" width="1440" height="106" rx="14" class="box"/>
  <text x="46" y="902" class="h">운영</text>
  <text x="46" y="926" class="t"><tspan font-weight="700">bun run init</tspan>  도구 점검 → memory 레포 → 모델 → 키(.env.local) → 자동 시작 → Tailscale Serve   ·   <tspan font-weight="700">bun run service</tspan>  macOS launchd · Linux systemd · Windows 시작 프로그램</text>
  <text x="46" y="950" class="t"><tspan font-weight="700">core 하나만 띄우면 됨</tspan>  core 가 서비스를 띄우고 감독 · 서비스가 다시 떠도 기기가 알아서 다시 붙음   ·   <tspan font-weight="700">시작 시 점검</tspan>  git · Pi 없으면 멈춤</text>
  <text x="46" y="972" class="m">테스트: bun test (memory 서비스를 따로 띄워 턴 · 대화 정리 · 사서 확인)</text>
</svg>
