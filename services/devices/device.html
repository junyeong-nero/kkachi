<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="까치 기기" />
<meta name="theme-color" content="#16181c" />
<link rel="icon" href="/favicon.png" type="image/png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css" />
<title>까치 기기</title>
<style>
  /* Hallmark · checked: 2026-11-25 · genre: modern-minimal (inferred) · shape: app screen
   * floor: 0 FAIL · fixed: 9 (7a, 15, 22, 26b, 34, 38iii, 39a, 40, 48, 63) · structural: 0 printed
   * built: the project · redesign: polish · v2.0.0 */
  /* Hallmark · waive 28b · the video is 1px, transparent and never the LCP · it is the camera surface device photos are taken from, never shown */
  /* Hallmark · answered F23 · a device page opened on the user's own tailnet, never shared as a link */
  /* A spare phone or tablet that Kkachi can speak through. Tokens from DESIGN.md (dark only: it
     sits in a room all day, so it stays dim). */
  :root {
    --bg: oklch(0.185 0.006 250); --surface: oklch(0.235 0.008 250); --line: oklch(0.31 0.01 250);
    --text: oklch(0.94 0.005 250); --muted: oklch(0.71 0.012 250);
    --accent: oklch(0.76 0.095 190); --accent-soft: oklch(0.3 0.045 192); --accent-ring: oklch(0.76 0.095 190 / .4);
    --accent-ink: oklch(0.2 0.03 192); /* icons on the light teal */
    --dim: oklch(0.1 0.005 250); /* the lamp's dimmer layer */
    --scrim: oklch(0.1 0.005 250 / .6); /* behind the settings sheet */
    --lamp-warm: oklch(0.9 0.07 70); --lamp-white: oklch(0.97 0.01 90); --lamp-night: oklch(0.55 0.13 40); /* lamp presets */
    --danger: oklch(0.74 0.13 40);
    --font: "SUIT Variable", "Apple SD Gothic Neo", sans-serif;
    --r-md: 14px; --r-pill: 999px; --ease-out: cubic-bezier(.22, 1, .36, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; overflow-x: clip; overscroll-behavior: none; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; min-height: 100dvh;
    padding: calc(12px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
    word-break: keep-all; overflow-wrap: anywhere;
  }
  /* the main screen is for using the device: talking to Kkachi, and the lamp. Switches live in settings */
  .top { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 560px; margin: 0 auto; min-height: 44px; }
  .brand { display: inline-flex; align-items: center; gap: 10px; min-width: 0; }
  .brand img { width: 28px; height: 28px; border-radius: 8px; flex: none; }
  #name { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .icon-btn {
    width: 44px; height: 44px; padding: 0; margin: 0; display: grid; place-items: center; flex: none;
    border: 0; border-radius: var(--r-pill); background: transparent; color: var(--muted);
    transition: background-color 120ms var(--ease-out), color 120ms var(--ease-out);
  }
  .icon-btn svg { width: 22px; height: 22px; }
  @media (hover: hover) { .icon-btn:hover { background: var(--surface); color: var(--text); } }
  .icon-btn:active { background: var(--line); color: var(--text); }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 560px; margin: 0 auto; text-align: center; }
  #status { font-size: 16px; color: var(--muted); margin: 8px 0 0; line-height: 1.5; }
  #status.ok { color: var(--text); }
  #status.err { color: var(--danger); }
  #said { font-size: 26px; line-height: 1.45; margin: 40px 0 0; min-height: 1.45em; word-break: keep-all; overflow-wrap: anywhere; color: var(--muted); }
  #said.speaking { color: var(--text); } /* the words being spoken now; earlier ones fade */
  form, #start { margin-top: 32px; width: 100%; }
  input {
    width: 100%; font: inherit; font-size: 18px; padding: 14px 16px; border-radius: var(--r-md); text-align: center;
    border: 1px solid var(--line); background: var(--surface); color: var(--text); outline: none;
  }
  input:focus-visible { outline: 3px solid var(--accent-ring); outline-offset: 1px; }
  button { font: inherit; cursor: pointer; }
  .btn {
    font-size: 18px; font-weight: 700; padding: 16px 28px; border-radius: var(--r-pill); border: 0;
    background: var(--text); color: var(--bg); margin-top: 12px;
  }
  button:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-ring); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .note { font-size: 14px; color: var(--muted); margin: 16px 0 0; line-height: 1.5; }
  [hidden] { display: none !important; }

  /* hold to talk: a big round button in the middle of the screen; teal only while it is listening (DESIGN.md) */
  #talk-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; padding: 24px 0; }
  #talk {
    width: 136px; height: 136px; padding: 0; margin: 0; border-radius: var(--r-pill); display: inline-grid; place-items: center;
    background: var(--surface); color: var(--text); border: 1px solid var(--line);
    touch-action: none; -webkit-touch-callout: none; position: relative;
    transition: background-color 120ms var(--ease-out); /* never box-shadow: the focus ring must not fade in */
  }
  #talk svg { width: 44px; height: 44px; }
  #talk:active { background: var(--line); }
  /* the voice-level halo: a disc behind the button, scaled with transform (4 to 18px around it) */
  #talk::before {
    content: ""; position: absolute; inset: -5px; border-radius: inherit; background: var(--accent-soft);
    z-index: -1; opacity: 0; transform: scale(calc(1 + var(--level, 0) * 0.23)); transition: transform 80ms linear;
  }
  #talk.recording { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  #talk.recording::before { opacity: 1; }
  #talk:disabled { color: var(--muted); cursor: progress; } /* waiting for Kkachi's answer */
  #talk-hint { margin-top: 20px; }
  #heard { font-size: 17px; color: var(--muted); margin: 24px 0 0; min-height: 1.5em; line-height: 1.5; overflow-wrap: anywhere; }
  #said { margin-top: 8px; }
  #talk-off { flex: 1; display: grid; place-items: center; }
  @media (prefers-reduced-motion: reduce) { #talk::before { transform: scale(1.03); transition: none; } }

  /* the input environment at a glance: which senses are on, and which one Kkachi is using now.
     Anyone in the room can see it; a tap opens the switches */
  #senses {
    display: inline-flex; gap: 4px; padding: 4px; margin: 0; border: 0; border-radius: var(--r-pill);
    background: var(--surface); color: var(--text);
  }
  @media (hover: hover) { #senses:hover { background: var(--line); } }
  #senses:active { background: var(--line); }
  .sense { width: 40px; height: 36px; display: grid; place-items: center; border-radius: var(--r-pill); transition: background-color 120ms var(--ease-out); }
  .sense svg { width: 20px; height: 20px; }
  .sense.off { color: var(--muted); opacity: .4; }
  .sense.busy { background: var(--line); }
  .sense.listening { background: var(--accent-soft); color: var(--accent); } /* teal: listening */
  #activity { font-size: 14px; color: var(--muted); margin: 10px 0 0; min-height: 1.5em; }

  /* the lamp: a preset fills the screen; a tap on the lit screen turns it off */
  #lamp-ctl { width: 100%; margin-top: 24px; padding: 16px; border-radius: var(--r-md); background: var(--surface); text-align: left; }
  #lamp-ctl h2 { font-size: 15px; font-weight: 700; margin: 0 0 12px; }
  .swatches { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .swatch {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 76px; padding: 12px 8px; margin: 0;
    border: 1px solid var(--line); border-radius: var(--r-md); background: var(--bg); color: var(--text); font-size: 15px; font-weight: 600;
    transition: background-color 120ms var(--ease-out), border-color 120ms var(--ease-out);
  }
  .swatch i { width: 24px; height: 24px; border-radius: 50%; flex: none; }
  @media (hover: hover) { .swatch:hover { border-color: var(--muted); } }
  .swatch:active { background: var(--line); }
  .swatch[aria-pressed=true] { border-color: var(--text); }
  .bright { display: flex; align-items: center; gap: 12px; margin-top: 12px; font-size: 14px; color: var(--muted); }
  .bright input { flex: 1; accent-color: var(--text); }
  #lamp-ctl .note { margin-top: 8px; }

  /* settings: a sheet with the switch cards, one per output and input */
  dialog#settings {
    margin: auto auto 0; width: 100%; max-width: 560px; max-height: 88dvh; padding: 0; border: 0; overflow: auto;
    border-radius: var(--r-md) var(--r-md) 0 0; background: var(--bg); color: var(--text);
  }
  dialog#settings::backdrop { background: var(--scrim); }
  .sheet { padding: 12px 20px calc(24px + env(safe-area-inset-bottom)); }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
  .sheet-head h2 { font-size: 19px; font-weight: 700; margin: 0; }
  .text-btn { border: 0; background: transparent; color: var(--text); font-size: 16px; font-weight: 700; padding: 10px 8px; margin: 0; border-radius: 8px; }
  .text-btn:active { background: var(--surface); }
  .sheet .note { text-align: left; }

  /* inputs and outputs: one switch card each, in two sections */
  #caps { margin-top: 12px; display: grid; gap: 16px; text-align: left; }
  #caps h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 8px; text-wrap: balance; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .cap {
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 2px 10px; width: 100%; margin: 0;
    padding: 12px; border-radius: var(--r-md); border: 1px solid transparent; background: var(--surface); color: var(--text);
    font: inherit; text-align: left; cursor: pointer; transition: background-color 120ms var(--ease-out), opacity 120ms var(--ease-out);
  }
  .cap svg { width: 22px; height: 22px; grid-row: span 2; }
  .cap .n { font-size: 15px; font-weight: 600; }
  .cap .s { font-size: 13px; color: var(--muted); grid-column: 2; }
  .cap .sw { grid-row: 1 / span 2; grid-column: 3; width: 38px; height: 22px; border-radius: var(--r-pill); background: var(--line); position: relative; transition: background-color 120ms var(--ease-out); }
  .cap .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform 120ms var(--ease-out), background-color 120ms var(--ease-out); }
  .cap[aria-checked=true] .sw { background: var(--text); }
  .cap[aria-checked=true] .sw::after { transform: translateX(16px); background: var(--bg); }
  .cap[aria-checked=false] svg, .cap[aria-checked=false] .n { opacity: .45; }
  .cap:disabled { background: transparent; border-color: var(--line); color: var(--muted); cursor: not-allowed; }
  .cap:active:not(:disabled) { background: var(--line); }
  .cap:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-ring); }
  .cap.busy { background: var(--line); }
  .cap.busy .s { color: var(--text); font-weight: 600; }
  .cap.listening { background: var(--accent-soft); } /* teal: listening, as on the talk button */
  .cap.listening svg, .cap.listening .s { color: var(--accent); }
  @media (prefers-reduced-motion: reduce) { .cap .sw::after { transition: none; } }

  /* lamp: the whole screen in one color (device_light, or a preset here); a tap turns it off */
  #lamp { position: fixed; inset: 0; z-index: 10; }
  #lamp-dim { position: absolute; inset: 0; background: var(--dim); }
  #update { margin-top: 16px; }
  #cam { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; } /* iOS needs the video in the page */
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img src="/favicon.png" alt="까치" /><span id="name">새 기기</span></div>
  <button type="button" class="icon-btn" id="open-settings" aria-label="설정" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
  </button>
</header>
<main>
  <p id="status" role="status"></p>
  <button type="button" class="btn" id="update" hidden>새 버전이 있어요. 눌러서 새로고침</button>

  <form id="setup" hidden>
    <input id="name-input" maxlength="40" placeholder="이 기기 이름 (예: 거실)" aria-label="이 기기 이름" required />
    <button type="submit" class="btn">시작</button>
  </form>
  <div id="start" hidden>
    <button type="button" class="btn" id="start-btn">탭해서 시작</button>
    <p class="note">소리와 마이크를 쓰려면 화면을 한 번 눌러야 해요.</p>
  </div>

  <section id="talk-area" hidden aria-label="까치에게 말 걸기">
    <button type="button" id="talk" aria-label="누르고 있는 동안 말하고, 떼면 까치에게 보내요">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <p class="note" id="talk-hint">누른 채로 말하고, 떼면 보내요</p>
    <p id="heard"></p>
    <p id="said" aria-live="polite"></p>
  </section>
  <p class="note" id="talk-off" hidden>말 걸기가 꺼져 있어요. 설정에서 켤 수 있어요.</p>

  <button type="button" id="senses" hidden></button>
  <p id="activity" aria-live="polite"></p>

  <section id="lamp-ctl" hidden aria-labelledby="lamp-title">
    <h2 id="lamp-title">조명</h2>
    <div class="swatches" id="swatches"></div>
    <label class="bright">밝기 <input type="range" id="bright" min="10" max="100" step="5" aria-label="밝기" /></label>
    <p class="note">켜진 화면을 누르면 꺼져요. 기기 화면 밝기보다 밝아지지는 않아요.</p>
  </section>
  <p class="note" id="lock-note" hidden>이 기기는 화면 꺼짐을 막을 수 없어요. 설정에서 자동 잠금을 꺼 두세요.</p>
</main>

<dialog id="settings" aria-labelledby="settings-title">
  <form class="sheet" method="dialog">
    <div class="sheet-head"><h2 id="settings-title">설정</h2><button class="text-btn" value="close">완료</button></div>
    <section id="caps" aria-label="이 기기로 할 수 있는 것">
      <div><h2>출력 (까치가 이 기기로)</h2><div class="grid" id="caps-in"></div></div>
      <div><h2>입력 (이 기기가 까치에게)</h2><div class="grid" id="caps-out"></div></div>
    </section>
    <p class="note">꺼 둔 것은 이 기기가 거절하고, 까치에게 물으면 꺼 두었다고 답해요. 조명 스위치는 까치가 켜는 것만 막고, 이 화면의 조명은 그대로 쓸 수 있어요.</p>
  </form>
</dialog>
<div id="lamp" hidden><div id="lamp-dim"></div></div>
<video id="cam" playsinline muted></video>
<script>
const $ = (id) => document.getElementById(id);
const store = { get: (k) => localStorage.getItem("kkachi.device." + k), set: (k, v) => localStorage.setItem("kkachi.device." + k, v), del: (k) => localStorage.removeItem("kkachi.device." + k) };
const VERSION = "__PAGE_VERSION__"; // filled in by the server; it says "update" when this page is old
let ws = null, audio = null, wakeLock = null, retry = 0, joined = false, allowed = false;

// What this browser can do, sent to Kkachi on connect (the sensor checklist reads it too).
const features = () => ({
  camera: !!navigator.mediaDevices?.getUserMedia, microphone: !!navigator.mediaDevices?.getUserMedia,
  motion: "DeviceMotionEvent" in window, orientation: "DeviceOrientationEvent" in window,
  geolocation: "geolocation" in navigator, wakeLock: "wakeLock" in navigator, push: "PushManager" in window,
  ambientLight: "AmbientLightSensor" in window, proximity: "ProximitySensor" in window, battery: !!navigator.getBattery,
  vibrate: !!navigator.vibrate, nfc: "NDEFReader" in window, bluetooth: !!navigator.bluetooth,
});

function status(text, cls = "") { $("status").textContent = text; $("status").className = cls; }
const armed = () => audio?.state === "running";
function showReady() {
  const ready = allowed && armed();
  $("talk-area").hidden = !(ready && isOn("talk"));
  $("talk-off").hidden = !(ready && !isOn("talk"));
  $("open-settings").hidden = !allowed;
  $("senses").hidden = !allowed;
  $("lamp-ctl").hidden = !joined; // the lamp works on its own, before Kkachi allows the device too
  if (allowed) status(armed() ? "연결됨" : "연결됨. 화면을 한 번 눌러 주세요", "ok");
  renderCaps();
}

// ---- what this device can do for Kkachi, shown on screen so anyone in the room can see it ----
// Permission per sense: ok | tap (ask with the start tap) | denied | none (this browser cannot).
const f0 = features();
const perm = { mic: f0.microphone ? "tap" : "none", camera: f0.camera ? "tap" : "none", motion: f0.motion ? "tap" : "none", location: f0.geolocation ? "tap" : "none" };
const inUse = new Map(); // cap -> what it is doing now
let lampOn = false, lampKey = null;
const icon = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const CAPS = [
  { key: "speak", to: "in", name: "말하기", icon: '<path d="M4 10v4h4l5 4V6L8 10H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/>', state: () => armed() ? "ok" : "tap" },
  { key: "light", to: "in", name: "조명", icon: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>', state: () => "ok", ok: () => lampOn ? "비추는 중" : "켜짐" }, // the switch allows it; the words say whether it is lit
  { key: "talk", to: "out", name: "말 걸기", icon: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>', state: () => armed() ? perm.mic : "tap" },
  { key: "camera", to: "out", name: "사진", icon: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>', state: () => perm.camera },
  { key: "sound", to: "out", name: "소리 크기", icon: '<path d="M3 12h2M7 8v8M11 5v14M15 9v6M19 11v2"/>', state: () => armed() ? perm.mic : "tap" },
  { key: "sensors", to: "out", name: "센서", icon: '<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>', state: () => perm.motion },
  { key: "location", to: "out", name: "위치", icon: '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>', state: () => perm.location },
];
const STATE = { ok: "켜짐", tap: "탭 필요", denied: "권한 없음", none: "지원 안 함" };

// Switches: turned off here, Kkachi cannot use it (the device refuses, and the server knows).
const enabled = JSON.parse(store.get("enabled") || "{}");
const isOn = (key) => enabled[key] !== false;
function toggle(key) {
  enabled[key] = !isOn(key);
  store.set("enabled", JSON.stringify(enabled));
  if (key === "light" && !isOn("light") && lampOn && !lampKey) lamp(false); // Kkachi lit it; a preset lit here stays
  showReady(); // the talk button follows "말 걸기"
  sendState();
}

const cards = {};
function renderCaps() {
  $("caps").hidden = !allowed;
  for (const c of CAPS) {
    let b = cards[c.key];
    if (!b) { // built once, then updated in place (keeps keyboard focus)
      b = cards[c.key] = document.createElement("button");
      b.type = "button"; b.className = "cap"; b.setAttribute("role", "switch");
      b.innerHTML = `${icon(c.icon)}<span class="n"></span><span class="s"></span><span class="sw" aria-hidden="true"></span>`;
      b.querySelector(".n").textContent = c.name;
      b.addEventListener("click", () => toggle(c.key));
      $(`caps-${c.to}`).append(b);
    }
    const st = c.state(), on = isOn(c.key), doing = inUse.get(c.key);
    const usable = st !== "none" && st !== "denied";
    b.disabled = !usable;
    b.setAttribute("aria-checked", String(on && usable));
    const listening = !!doing && (c.key === "sound" || doing === "듣는 중");
    b.classList.toggle("busy", !!doing && !listening);
    b.classList.toggle("listening", listening);
    b.querySelector(".s").textContent = doing ?? (!usable ? STATE[st] : !on ? "꺼 둠" : st === "ok" && c.ok ? c.ok() : STATE[st]);
  }
  renderSenses();
}

// The input environment at a glance on the main screen: an icon per input, dim when off, marked
// while Kkachi uses it (teal while listening). A tap opens the switches.
const SENSES = ["talk", "camera", "sound", "sensors", "location"];
function renderSenses() {
  const strip = $("senses");
  if (!strip.childElementCount) {
    for (const key of SENSES) {
      const s = document.createElement("span");
      s.dataset.key = key;
      s.innerHTML = icon(CAPS.find((c) => c.key === key).icon);
      strip.append(s);
    }
  }
  const words = [];
  for (const s of strip.children) {
    const c = CAPS.find((x) => x.key === s.dataset.key), st = c.state(), doing = inUse.get(c.key);
    const usable = st !== "none" && st !== "denied", on = usable && isOn(c.key);
    const listening = !!doing && (c.key === "sound" || doing === "듣는 중");
    s.className = "sense" + (on ? "" : " off") + (doing ? (listening ? " listening" : " busy") : "");
    words.push(`${c.name} ${doing ?? (on ? "켜짐" : usable ? "꺼 둠" : STATE[st])}`);
  }
  strip.setAttribute("aria-label", `입력 상태: ${words.join(", ")}. 눌러서 설정 열기`);
}

// ---- the lamp: presets lit from this screen, or Kkachi's device_light ----
const LAMPS = [
  { key: "warm", name: "따뜻하게", color: "var(--lamp-warm)" },
  { key: "white", name: "하얗게", color: "var(--lamp-white)" },
  { key: "night", name: "은은하게", color: "var(--lamp-night)" },
];
// lampKey: the preset lit from this screen; null when off or lit by Kkachi
function lamp(on, color, brightness, key = null) {
  lampOn = on; lampKey = on ? key : null;
  $("lamp").hidden = !on;
  if (on) {
    $("lamp").style.background = color;
    $("lamp-dim").style.opacity = String(1 - Math.max(0, Math.min(100, brightness)) / 100);
  }
  for (const b of $("swatches").children) b.setAttribute("aria-pressed", String(b.dataset.key === lampKey));
  renderCaps();
}
$("bright").value = store.get("bright") || "80";
$("bright").addEventListener("input", () => store.set("bright", $("bright").value));
for (const l of LAMPS) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "swatch"; b.dataset.key = l.key; b.setAttribute("aria-pressed", "false");
  b.innerHTML = `<i style="background: ${l.color}" aria-hidden="true"></i>`;
  b.append(l.name);
  b.addEventListener("click", () => lamp(true, l.color, Number($("bright").value), l.key));
  $("swatches").append(b);
}
const openSettings = () => { if (!$("settings").open) $("settings").showModal(); };
$("open-settings").addEventListener("click", openSettings);
$("senses").addEventListener("click", openSettings);
const setBusy = (key, label) => { if (label) inUse.set(key, label); else inUse.delete(key); renderCaps(); };
// The last thing Kkachi did through this device, with the time: nobody nearby is left guessing.
function activity(text) {
  const time = new Date().toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" });
  $("activity").textContent = `${time}에 ${text}`;
}
function sendState() {
  renderCaps();
  const granted = Object.fromEntries(Object.entries(perm).map(([k, v]) => [k, v === "ok"]));
  const switches = Object.fromEntries(CAPS.map((c) => [c.key, isOn(c.key)]));
  ws?.readyState === 1 && ws.send(JSON.stringify({ type: "state", armed: armed(), perms: granted, enabled: switches }));
}

// Play mp3 (base64) and show its words while they are spoken.
async function play(b64, words) {
  const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  const buffer = await audio.decodeAudioData(bytes.buffer);
  $("said").textContent = words; $("said").className = "speaking";
  const src = audio.createBufferSource(); src.buffer = buffer; src.connect(audio.destination);
  await new Promise((resolve) => { src.onended = resolve; src.start(); });
  $("said").className = "";
}

// Sound needs one tap (iOS). The same tap keeps the screen on, which keeps the page alive, and asks
// for the sensors now, while someone is there to allow them (a later prompt would wait for nobody).
async function arm() {
  audio ??= new (window.AudioContext || window.webkitAudioContext)();
  const motionAsk = askMotion(); // must start inside the tap on iOS
  await audio.resume().catch(() => {});
  await motionAsk;
  askLocation();
  await openMic();
  await askCamera();
  const silent = audio.createBufferSource(); silent.buffer = audio.createBuffer(1, 1, 22050); silent.connect(audio.destination); silent.start();
  await keepAwake();
  $("start").hidden = armed();
  sendState();
  showReady();
}
async function keepAwake() {
  if (!("wakeLock" in navigator)) { $("lock-note").hidden = false; return; }
  try { wakeLock = await navigator.wakeLock.request("screen"); } catch { $("lock-note").hidden = false; }
}

function connect() {
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/api/device/ws`);
  ws.onopen = () => { retry = 0; ws.send(JSON.stringify({ type: "hello", name: store.get("name"), token: store.get("token"), armed: armed(), features: features(), version: VERSION })); sendState(); flushOutbox(); };
  ws.onmessage = (e) => onMessage(JSON.parse(e.data));
  ws.onclose = () => {
    if (!joined) return;
    status("까치에 다시 연결하는 중…");
    setTimeout(connect, Math.min(10_000, 1000 * 2 ** retry++));
  };
}

async function onMessage(m) {
  if (m.type === "pending" || m.type === "ready") {
    store.set("token", m.token);
    $("name").textContent = m.name;
    allowed = m.type === "ready";
    if (!allowed) status("휴대폰 까치 앱의 설정 → 기기에서 이 기기를 허용해 주세요.");
    showReady();
  }
  if (m.type === "forgotten") {
    joined = false; allowed = false; store.del("token"); ws.close();
    status("이 기기는 연결이 해제됐어요. 다시 쓰려면 새로고침하세요.", "err");
  }
  if (m.type === "update") $("update").hidden = false;
  if (m.type === "ack") onAck(m);
  if (m.type === "reply") onReply(m);
  if (m.type === "ready") $("update").hidden = true; // told again on every connect when still old
  const handler = REQUESTS[m.type];
  if (handler && m.id) {
    const [cap, doing, did] = SHOWN[m.type](m);
    const off = m.type === "sensors" ? !isOn("sensors") && !isOn("location") : !isOn(cap);
    if (off) { ws.send(JSON.stringify({ type: "result", id: m.id, ok: false, error: "turned off on the device" })); return; }
    setBusy(cap, doing);
    try {
      ws.send(JSON.stringify({ type: "result", id: m.id, ok: true, data: await handler(m) }));
      activity(did);
    } catch (err) {
      ws.send(JSON.stringify({ type: "result", id: m.id, ok: false, error: String(err.message || err) }));
      if (!armed()) $("start").hidden = false;
    } finally {
      setBusy(cap, null);
    }
  }
}
// How each request shows on screen: [cap, while doing it, afterwards].
const SHOWN = {
  speak: () => ["speak", "말하는 중", "까치가 말했어요"],
  snapshot: () => ["camera", "찍는 중", "까치가 사진을 찍었어요 (저장 안 함)"],
  sound: () => ["sound", "재는 중", "까치가 소리 크기를 쟀어요 (녹음 안 함)"],
  sensors: () => ["sensors", "읽는 중", "까치가 센서를 읽었어요"],
  light: (m) => ["light", m.on ? "켜는 중" : "끄는 중", m.on ? "까치가 조명을 켰어요" : "까치가 조명을 껌어요"],
};

// ---- what Kkachi can ask of this device (src/devices.ts). Nothing is kept here. ----
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const REQUESTS = {
  async speak(m) {
    if (!armed()) throw new Error("needs a tap on the screen");
    $("heard").textContent = "";
    await play(m.audio, m.text);
  },

  // One frame from the camera, scaled to at most 1280 px, and the mean brightness of the scene.
  async snapshot(m) {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: m.camera === "front" ? "user" : "environment", width: { ideal: 1920 }, height: { ideal: 1080 } } });
    try {
      const video = $("cam");
      video.srcObject = stream;
      await video.play();
      await sleep(800); // exposure and focus settle
      const scale = Math.min(1, 1280 / Math.max(video.videoWidth, video.videoHeight));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(video.videoWidth * scale); canvas.height = Math.round(video.videoHeight * scale);
      const g = canvas.getContext("2d");
      g.drawImage(video, 0, 0, canvas.width, canvas.height);
      const px = g.getImageData(0, 0, canvas.width, canvas.height).data;
      let luma = 0, n = 0;
      for (let i = 0; i < px.length; i += 4 * 97) { luma += 0.2126 * px[i] + 0.7152 * px[i + 1] + 0.0722 * px[i + 2]; n++; }
      const url = canvas.toDataURL("image/jpeg", 0.85);
      return { data: url.slice(url.indexOf(",") + 1), width: canvas.width, height: canvas.height, brightness: Math.round(luma / n / 2.55) };
    } finally {
      stream.getTracks().forEach((t) => t.stop());
      $("cam").srcObject = null;
    }
  },

  // Loudness for a few seconds: mean and peak level of 4096-sample blocks, in dBFS.
  async sound(m) {
    if ((await openMic()) === "denied") throw new Error("microphone not allowed");
    const levels = [];
    meter = (rms) => levels.push(rms);
    await sleep(Math.min(10, Math.max(1, m.seconds || 3)) * 1000);
    meter = null;
    if (!levels.length) throw new Error("the microphone gave no sound (tap the screen)");
    const db = (x) => 20 * Math.log10(Math.max(x, 1e-6));
    return { avg: db(Math.sqrt(levels.reduce((s, x) => s + x * x, 0) / levels.length)), peak: db(Math.max(...levels)) };
  },

  async sensors() {
    const out = { unavailable: {} };
    if (!isOn("sensors")) out.unavailable["motion and orientation"] = "turned off on the device";
    else {
      if (orient) Object.assign(out, orient);
      else out.unavailable.orientation = motion.started ? "no readings: this device may have no such sensor" : motionState;
      if (motion.started) {
        out.motion = true;
        const cut = Date.now() - 10 * 60_000;
        motion.samples = motion.samples.filter((s) => s.t > cut);
        out.maxRecent = +Math.max(0, ...motion.samples.map((s) => s.a)).toFixed(1);
        if (motion.lastMoved) out.lastMovedAgoSec = Math.round((Date.now() - motion.lastMoved) / 1000);
      } else out.unavailable.motion = motionState;
    }
    if (!isOn("location")) out.unavailable.location = "turned off on the device";
    else try { out.location = await locate(); } catch (err) { out.unavailable.location = String(err.message || err); }
    return out;
  },

  light(m) { lamp(!!m.on, m.color, m.brightness); },
};
$("lamp").addEventListener("click", () => lamp(false));
$("update").addEventListener("click", () => location.reload());

// ---- sensors: motion and orientation (iOS asks once, inside a tap), location ----
let orient = null, motionState = "not allowed yet (tap the screen)";
const motion = { started: false, samples: [], lastMoved: 0 };
async function askMotion() {
  try { // both requests start inside the tap, before any await
    const answers = await Promise.all([window.DeviceMotionEvent, window.DeviceOrientationEvent].map((E) => E?.requestPermission?.() ?? "granted"));
    if (answers.some((a) => a !== "granted")) { motionState = "denied"; perm.motion = "denied"; return; }
  } catch (err) { motionState = String(err.message || err); perm.motion = "denied"; return; }
  perm.motion = "ok";
  if (motion.started) return;
  motion.started = true;
  addEventListener("devicemotion", (e) => {
    const a = e.acceleration;
    if (!a || a.x == null) return;
    const mag = Math.hypot(a.x, a.y, a.z);
    const now = Date.now();
    if (mag > 0.6) motion.lastMoved = now;
    const last = motion.samples[motion.samples.length - 1];
    if (!last || now - last.t > 1000 || mag > last.a) motion.samples.push({ t: now, a: mag }); // about one sample a second
    if (motion.samples.length > 2000) motion.samples.splice(0, 1000);
  });
  addEventListener("deviceorientation", (e) => {
    if (e.beta == null) return;
    const beta = Math.round(e.beta), gamma = Math.round(e.gamma);
    const pose = Math.abs(beta) < 25 && Math.abs(gamma) < 25 ? "flat, screen up" : Math.abs(beta) > 155 ? "flat, screen down"
      : Math.abs(beta) > 55 ? "standing upright" : Math.abs(gamma) > 55 ? "on its side" : "tilted";
    const heading = e.webkitCompassHeading ?? (e.absolute && e.alpha != null ? Math.round(360 - e.alpha) : null);
    orient = { beta, gamma, pose, heading: heading == null ? null : Math.round(heading) % 360 };
  });
}
function locate() {
  return new Promise((resolve, reject) => {
    if (!("geolocation" in navigator)) return reject(new Error("not supported"));
    navigator.geolocation.getCurrentPosition(
      (p) => resolve({ lat: +p.coords.latitude.toFixed(5), lon: +p.coords.longitude.toFixed(5), accuracy: Math.round(p.coords.accuracy) }),
      (err) => reject(new Error(err.code === 1 ? "not allowed" : "no fix")),
      { timeout: 8000, maximumAge: 60_000 });
  });
}
const askLocation = () => locate()
  .then(() => { perm.location = "ok"; }, (err) => { perm.location = err.message === "not allowed" ? "denied" : err.message === "not supported" ? "none" : "ok"; })
  .finally(sendState);
// Ask for the camera once now (and let go at once), so a later photo needs no prompt.
async function askCamera() {
  if (perm.camera === "none") return;
  try { (await navigator.mediaDevices.getUserMedia({ video: true })).getTracks().forEach((t) => t.stop()); perm.camera = "ok"; }
  catch { perm.camera = "denied"; }
}

// ---- hold to talk: record while the button is held, send when it is let go (src/port.ts) ----
const MIN_MS = 300, MAX_MS = 30_000, RATE = 16000;
let mic = null, frames = [], recording = false, recordStart = 0, maxTimer = null, meter = null;
const hint = (text) => { $("talk-hint").textContent = text; };

// The mic stays open once allowed: this device sits in one place for this job.
async function openMic() {
  if (mic && mic.stream.getAudioTracks()[0]?.readyState === "live") return "open";
  try {
    // No gain control or noise suppression: they would hide how loud the room is (device_sound_level).
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: false } });
    const src = audio.createMediaStreamSource(stream), proc = audio.createScriptProcessor(4096, 1, 1), sink = audio.createGain();
    sink.gain.value = 0; src.connect(proc); proc.connect(sink); sink.connect(audio.destination);
    proc.onaudioprocess = (e) => {
      if (!recording && !meter) return;
      const f = new Float32Array(e.inputBuffer.getChannelData(0));
      let sum = 0; for (let i = 0; i < f.length; i++) sum += f[i] * f[i];
      const rms = Math.sqrt(sum / f.length);
      meter?.(rms);
      if (!recording) return;
      frames.push(f);
      $("talk").style.setProperty("--level", Math.min(rms / 0.08, 1).toFixed(2));
    };
    const first = !mic;
    mic = { stream, nodes: [src, proc, sink] };
    perm.mic = "ok";
    return first ? "granted" : "open";
  } catch {
    hint("마이크를 쓸 수 없어요. 브라우저 설정에서 허용해 주세요.");
    if (perm.mic !== "none") perm.mic = "denied";
    return "denied";
  }
}

async function startTalking() {
  if (recording) return;
  recording = true; frames = [];
  ws?.readyState === 1 && ws.send(JSON.stringify({ type: "warm" })); // Kkachi gets ready while you speak
  await audio.resume().catch(() => {});
  const m = await openMic();
  if (m === "denied") { recording = false; return; }
  if (m === "granted") { recording = false; hint("마이크 준비됐어요. 다시 누른 채로 말하세요"); return; } // the permission prompt took this press
  if (!recording) return; // let go while the mic was opening
  frames = []; recordStart = performance.now();
  $("talk").classList.add("recording"); hint("듣고 있어요. 떼면 보내요"); setBusy("talk", "듣는 중");
  maxTimer = setTimeout(stopTalking, MAX_MS);
}

async function stopTalking() {
  if (!recording) return;
  recording = false; clearTimeout(maxTimer);
  $("talk").classList.remove("recording"); $("talk").style.setProperty("--level", "0");
  if (performance.now() - recordStart < MIN_MS || frames.length < 2) { hint("누른 채로 말하고, 떼면 보내요"); setBusy("talk", null); return; }
  setBusy("talk", null);
  const at = Date.now();
  const wav = await toBase64(encodeWav(frames, audio.sampleRate, RATE));
  outbox.push({ id: newId(), at, audio: wav, mime: "audio/wav" });
  hint("보내는 중…");
  flushOutbox();
}

// ---- what this device says goes out as an input, not a request (docs/bus.md) ----
// It waits in the outbox until Kkachi acks it, and is sent again every 5 s and on every reconnect
// with the same id, so it is handled once. Past 60 s it is dropped: a late "불 꺼줘" must not run.
// The device does not wait for an answer: one comes as a "reply" only if Kkachi answers here.
const INPUT_TTL = 60_000;
let outbox = [], lastReply = null;
const newId = () => crypto.randomUUID?.() ?? `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 12)}`;
async function toBase64(blob) {
  const bytes = new Uint8Array(await blob.arrayBuffer());
  let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
function flushOutbox() {
  const expired = outbox.filter((x) => Date.now() - x.at > INPUT_TTL);
  if (expired.length) { outbox = outbox.filter((x) => !expired.includes(x)); hint("까치에 전하지 못했어요. 다시 말해 주세요"); }
  if (ws?.readyState !== 1) return;
  for (const x of outbox) ws.send(JSON.stringify({ type: "input", id: x.id, kind: "talk", age: Date.now() - x.at, audio: x.audio, mime: x.mime }));
}
setInterval(flushOutbox, 5000);
const ACK_ERRORS = { "switched off": "말 걸기가 꺼져 있어요", expired: "너무 늦게 도착해서 버렸어요. 다시 말해 주세요" };
function onAck(m) {
  if (!outbox.some((x) => x.id === m.id)) return;
  outbox = outbox.filter((x) => x.id !== m.id);
  hint(m.ok ? "전했어요" : ACK_ERRORS[m.error] ?? "까치가 받지 못했어요");
}
async function onReply(m) {
  if (m.inputId === lastReply) return; // sent again after a reconnect
  lastReply = m.inputId;
  hint("누른 채로 말하고, 떼면 보내요");
  if (!m.heard) { $("heard").textContent = ""; hint("잘 못 들었어요. 다시 말해 주세요"); return; }
  $("heard").textContent = `“${m.heard}”`;
  if (m.elsewhere) { $("said").textContent = m.elsewhere; $("said").className = ""; return; }
  if (m.audio && armed() && isOn("speak")) {
    setBusy("speak", "말하는 중");
    try { await play(m.audio, m.text); } catch { $("said").textContent = m.text; } finally { setBusy("speak", null); }
  } else { $("said").textContent = m.text; $("said").className = ""; }
}

// 16 kHz mono 16-bit WAV, as the phone app sends (src/web/app.js).
function encodeWav(frames, inRate, outRate) {
  const total = frames.reduce((n, f) => n + f.length, 0);
  const all = new Float32Array(total); let o = 0;
  for (const f of frames) { all.set(f, o); o += f.length; }
  const ratio = inRate / outRate, outLen = Math.floor(total / ratio);
  const pcm = new Int16Array(outLen);
  for (let i = 0; i < outLen; i++) {
    const s = Math.floor(i * ratio), e = Math.min(Math.floor((i + 1) * ratio), total);
    let acc = 0; for (let j = s; j < e; j++) acc += all[j];
    const v = Math.max(-1, Math.min(1, acc / Math.max(1, e - s)));
    pcm[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
  }
  const buf = new ArrayBuffer(44 + pcm.byteLength), d = new DataView(buf);
  const w = (p, s) => { for (let i = 0; i < s.length; i++) d.setUint8(p + i, s.charCodeAt(i)); };
  w(0, "RIFF"); d.setUint32(4, 36 + pcm.byteLength, true); w(8, "WAVE"); w(12, "fmt ");
  d.setUint32(16, 16, true); d.setUint16(20, 1, true); d.setUint16(22, 1, true);
  d.setUint32(24, outRate, true); d.setUint32(28, outRate * 2, true); d.setUint16(32, 2, true); d.setUint16(34, 16, true);
  w(36, "data"); d.setUint32(40, pcm.byteLength, true);
  new Int16Array(buf, 44).set(pcm);
  return new Blob([buf], { type: "audio/wav" });
}

$("talk").addEventListener("pointerdown", (e) => { e.preventDefault(); $("talk").setPointerCapture?.(e.pointerId); startTalking(); });
for (const ev of ["pointerup", "pointercancel"]) $("talk").addEventListener(ev, stopTalking);
$("talk").addEventListener("contextmenu", (e) => e.preventDefault()); // long press: no menu

function join() {
  joined = true;
  $("name").textContent = store.get("name");
  $("setup").hidden = true; $("start").hidden = false;
  showReady();
  status("연결하는 중…");
  connect();
}

$("setup").addEventListener("submit", (e) => { e.preventDefault(); store.set("name", $("name-input").value.trim()); join(); arm(); });
$("start-btn").addEventListener("click", arm);
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible") return;
  if (audio) await audio.resume().catch(() => {}); // iOS suspends audio in the background
  if (wakeLock?.released !== false) await keepAwake(); // the lock is released when the page is hidden
  $("start").hidden = armed() || !joined;
  sendState();
  showReady();
});

const preset = new URLSearchParams(location.search).get("name");
if (preset && !store.get("name")) store.set("name", preset);
if (store.get("name")) join();
else { $("setup").hidden = false; status("이 기기를 어디에 둘지 이름을 붙여 주세요."); $("name-input").focus(); }
</script>
