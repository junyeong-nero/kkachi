<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="까치 기기" />
<meta name="theme-color" content="#16181c" />
<link rel="icon" href="/api/device/icon.png" type="image/png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css" />
<title>까치 기기</title>
<style>
  /* Hallmark · checked: 2026-11-25 · genre: modern-minimal (inferred) · shape: app screen
   * floor: 0 FAIL · fixed: 9 (7a, 15, 22, 26b, 34, 38iii, 39a, 40, 48, 63) · structural: 0 printed
   * built: the project · redesign: polish · v2.0.0 */
  /* Hallmark · waive 28b · the video is 1px, transparent and never the LCP · it is the camera surface device photos are taken from, never shown */
  /* Hallmark · dismissed F7 · checked each: #talk and #senses are buttons, .sense is a mark inside the #senses button; all are controls */
  /* Hallmark · answered F23 · a device page opened on the user's own tailnet, never shared as a link */
  /* A spare phone or tablet that Kkachi can speak through. Tokens from DESIGN.md (dark only: it
     sits in a room all day, so it stays dim). */
  :root {
    --bg: oklch(0.185 0.006 250); --surface: oklch(0.235 0.008 250); --line: oklch(0.31 0.01 250);
    --text: oklch(0.94 0.005 250); --muted: oklch(0.71 0.012 250);
    --accent: oklch(0.76 0.095 190); --accent-soft: oklch(0.3 0.045 192); --accent-ring: oklch(0.76 0.095 190 / .4);
    --accent-ink: oklch(0.2 0.03 192); /* icons on the light teal */
    --dim: oklch(0.1 0.005 250); /* the lamp's dimmer layer */
    --scrim: oklch(0.1 0.005 250 / .6); /* behind the settings sheet */
    --danger: oklch(0.74 0.13 40);
    --font: "SUIT Variable", "Apple SD Gothic Neo", sans-serif;
    --r-md: 14px; --r-pill: 999px; --ease-out: cubic-bezier(.22, 1, .36, 1);
  }
  * { box-sizing: border-box; }
  /* The main screen is for talking to Kkachi; the switches live in settings, and the lamp is Kkachi's to
     light. The page fits the screen in either orientation and never scrolls. The talk button sits at the
     exact centre: the header floats above, what was heard and said fills the row over the button, and
     the hint, status and inputs the row under it (two equal rows). */
  html, body { margin: 0; height: 100%; overflow: clip; overscroll-behavior: none; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased;
    display: grid; height: 100dvh; position: relative;
    /* the same above and below, so the centre of the page is the centre of the screen */
    --edge: calc(16px + max(env(safe-area-inset-top), env(safe-area-inset-bottom)));
    padding: var(--edge) max(20px, env(safe-area-inset-right)) var(--edge) max(20px, env(safe-area-inset-left));
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
    word-break: keep-all; overflow-wrap: anywhere;
  }
  .top {
    position: absolute; z-index: 1; top: calc(12px + env(safe-area-inset-top)); left: max(20px, env(safe-area-inset-left)); right: max(20px, env(safe-area-inset-right));
    max-width: 560px; margin: 0 auto; min-height: 44px; display: flex; align-items: center; justify-content: space-between;
  }
  .brand { display: inline-flex; align-items: center; gap: 10px; min-width: 0; }
  .brand img { width: 28px; height: 28px; border-radius: 8px; flex: none; }
  #name { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .icon-btn {
    width: 44px; height: 44px; padding: 0; margin: 0; display: grid; place-items: center; flex: none;
    border: 0; border-radius: var(--r-pill); background: transparent; color: var(--muted);
    transition: background-color 120ms var(--ease-out), color 120ms var(--ease-out);
  }
  .icon-btn svg { width: 22px; height: 22px; }
  @media (hover: hover) { .icon-btn:hover { background: var(--surface); color: var(--text); } }
  .icon-btn:active { background: var(--line); color: var(--text); }
  main {
    min-height: 0; width: 100%; max-width: 560px; margin: 0 auto; text-align: center; --pad: clamp(96px, min(40vw, 20dvh), 164px);
    display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto minmax(0, 1fr); grid-template-areas: "above" "talk" "below";
  }
  #above { grid-area: above; min-height: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; padding: 56px 0 20px; }
  #below { grid-area: below; min-height: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; padding-top: 48px; }
  #msg { width: 100%; }
  #dock { width: 100%; margin-top: auto; display: flex; flex-direction: column; align-items: center; }
  /* naming, the start tap, waiting to be allowed: only the message, in the middle */
  body:not(.ready) #above, body:not(.ready) #dock { display: none; }
  body:not(.ready) #below { grid-area: 1 / 1 / -1 / -1; justify-content: center; padding: 56px 0; }
  #status { font-size: 16px; color: var(--muted); margin: 8px 0 0; line-height: 1.5; }
  #status.ok { color: var(--text); }
  #status.err { color: var(--danger); }
  #said { font-size: 22px; line-height: 1.45; min-height: 1.45em; color: var(--muted); }
  #said.speaking { color: var(--text); } /* the words being spoken now; earlier ones fade */
  form, #start { margin-top: 32px; width: 100%; }
  #name-input {
    width: 100%; font: inherit; font-size: 18px; padding: 14px 16px; border-radius: var(--r-md); text-align: center;
    border: 1px solid var(--line); background: var(--surface); color: var(--text); outline: none;
  }
  #name-input:focus-visible { outline: 3px solid var(--accent-ring); outline-offset: 1px; }
  button { font: inherit; cursor: pointer; }
  .btn {
    font-size: 18px; font-weight: 700; padding: 16px 28px; border-radius: var(--r-pill); border: 0;
    background: var(--text); color: var(--bg); margin-top: 12px;
  }
  button:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-ring); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .note { font-size: 14px; color: var(--muted); margin: 16px 0 0; line-height: 1.5; }
  [hidden] { display: none !important; }

  /* the talk pad, at the centre of the screen, while this device's voice is open to Kkachi: hold to
     talk, teal only while it is listening (DESIGN.md). Gone while the screen is a lamp */
  #talk-area { grid-area: talk; position: relative; display: grid; place-items: center; }
  #pads { display: grid; grid-template-columns: var(--pad); }
  .pad {
    width: var(--pad); height: var(--pad); padding: 0 0 18%; margin: 0; border-radius: var(--r-md); display: grid; place-items: center;
    background: var(--surface); color: var(--text); border: 1px solid var(--line);
    touch-action: none; -webkit-touch-callout: none; position: relative;
    transition: background-color 120ms var(--ease-out); /* never box-shadow: the focus ring must not fade in */
  }
  .pad > svg { width: 30%; height: 30%; }
  .pad .t { position: absolute; left: 0; right: 0; bottom: 11%; font-size: 13px; line-height: 1.3; color: var(--muted); font-variant-numeric: tabular-nums; }
  button.pad:active { background: var(--line); }
  /* the voice-level halo: a disc behind the button, scaled with transform (4 to 18px around it) */
  #talk::before {
    content: ""; position: absolute; inset: -5px; border-radius: inherit; background: var(--accent-soft);
    z-index: -1; opacity: 0; transform: scale(calc(1 + var(--level, 0) * 0.23)); transition: transform 80ms linear;
  }
  #talk.recording, #talk.recording .t { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  #talk.recording::before { opacity: 1; }
  #talk:disabled { color: var(--muted); cursor: progress; } /* waiting for Kkachi's answer */
  /* under the button without pushing it off centre */
  #heard { font-size: 17px; color: var(--muted); margin: auto 0 0; min-height: 1.5em; line-height: 1.5; }
  #said { margin: 4px 0 0; }
  #heard, #said { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; flex: none; }
  #said { -webkit-line-clamp: 3; line-clamp: 3; }
  #talk-off { grid-area: talk; justify-self: center; max-width: 280px; margin: 0; }
  @media (prefers-reduced-motion: reduce) { #talk::before { transform: scale(1.03); transition: none; } }

  /* the input environment at a glance: which senses are on, and which one Kkachi is using now.
     Anyone in the room can see it; a tap opens the switches */
  #senses {
    display: inline-flex; gap: 4px; padding: 4px; margin: 0; border: 0; border-radius: var(--r-pill);
    background: var(--surface); color: var(--text);
  }
  @media (hover: hover) { #senses:hover { background: var(--line); } }
  #senses:active { background: var(--line); }
  .sense { width: 40px; height: 36px; display: grid; place-items: center; border-radius: var(--r-pill); transition: background-color 120ms var(--ease-out); }
  .sense svg { width: 20px; height: 20px; }
  .sense.off { color: var(--muted); opacity: .4; }
  .sense.busy { background: var(--line); }
  .sense.listening { background: var(--accent-soft); color: var(--accent); } /* teal: listening */
  /* the log: what was said here and what Kkachi did here, with the time, behind one button at the lower
     right, so the screen itself stays the pads. A dot on the button: something new since it was opened */
  #open-log { position: fixed; z-index: 5; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); }
  #open-log.new::after { content: ""; position: absolute; top: 9px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--text); }
  #log-list { list-style: none; margin: 8px 0 0; padding: 0; text-align: left; }
  #log-list li { display: grid; grid-template-columns: 5.5em minmax(0, 1fr); gap: 12px; padding: 10px 0; font-size: 15px; line-height: 1.45; }
  #log-list li + li { border-top: 1px solid var(--line); }
  #log-list time { color: var(--muted); font-variant-numeric: tabular-nums; }
  #log-list .none { display: block; color: var(--muted); }

  /* a small old phone: fewer lines, no hint */
  @media (orientation: portrait) and (max-height: 560px) {
    #below { padding-top: 16px; }
    #heard { -webkit-line-clamp: 1; line-clamp: 1; }
    #said { font-size: 20px; -webkit-line-clamp: 2; line-clamp: 2; }
  }

  /* a phone on its side: the button stays at the centre, the words on its left, status and inputs on its right */
  @media (orientation: landscape) and (max-height: 600px) {
    .top, main { max-width: 960px; }
    main {
      --pad: clamp(80px, 30dvh, 136px); column-gap: 24px;
      grid-template-columns: minmax(0, 1fr) minmax(200px, auto) minmax(0, 1fr);
      grid-template-areas: "above . below" "above talk below" "above . below";
    }
    #above, #below { padding: 56px 0 0; justify-content: center; }
    #said { margin-bottom: auto; -webkit-line-clamp: 2; line-clamp: 2; }
    #dock { margin-top: 12px; }
    /* the inputs run down the side, not along it: there is height here and little width */
    #senses { flex-direction: column; gap: 2px; }
    .sense { height: clamp(28px, 9dvh, 36px); }
    dialog { max-width: 720px; }
  }

  /* sheets: settings, with the switch cards, one per output and input; and the log */
  dialog {
    margin: auto auto 0; width: 100%; max-width: 560px; max-height: 88dvh; padding: 0; border: 0; overflow: auto;
    border-radius: var(--r-md) var(--r-md) 0 0; background: var(--bg); color: var(--text);
  }
  dialog::backdrop { background: var(--scrim); }
  .sheet { padding: 12px 20px calc(24px + env(safe-area-inset-bottom)); }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
  .sheet-head h2 { font-size: 19px; font-weight: 700; margin: 0; }
  .text-btn { border: 0; background: transparent; color: var(--text); font-size: 16px; font-weight: 700; padding: 10px 8px; margin: 0; border-radius: 8px; }
  .text-btn:active { background: var(--surface); }
  .sheet .note { text-align: left; }

  /* inputs and outputs: one card each, in two sections. They show how things are; what is open to
     Kkachi and what is joined to what is chosen in Kkachi Home, not here */
  #caps { margin-top: 12px; display: grid; gap: 16px; text-align: left; }
  #caps h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 8px; text-wrap: balance; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .cap {
    display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 2px 10px; width: 100%; margin: 0;
    padding: 12px; border-radius: var(--r-md); border: 1px solid transparent; background: var(--surface); color: var(--text);
    text-align: left; transition: background-color 120ms var(--ease-out);
  }
  .cap svg { width: 22px; height: 22px; grid-row: span 2; }
  .cap .n { font-size: 15px; font-weight: 600; }
  .cap .s { font-size: 13px; color: var(--muted); grid-column: 2; }
  .cap[data-on=false] svg, .cap[data-on=false] .n { opacity: .45; }
  .cap.none { background: transparent; border-color: var(--line); color: var(--muted); } /* cannot be used on this device */
  .cap.busy { background: var(--line); }
  .cap.busy .s { color: var(--text); font-weight: 600; }
  .cap.listening { background: var(--accent-soft); } /* teal: listening, as on the talk button */
  .cap.listening svg, .cap.listening .s { color: var(--accent); }

  /* lamp: the whole screen in one color (device_light, or a preset here); a tap turns it off */
  #lamp { position: fixed; inset: 0; z-index: 10; }
  #lamp-dim { position: absolute; inset: 0; background: var(--dim); }
  #update { margin-top: 16px; }
  #cam { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; } /* iOS needs the video in the page */
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img src="/api/device/icon.png" alt="까치" /><span id="name">새 기기</span></div>
  <button type="button" class="icon-btn" id="open-settings" aria-label="설정" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
  </button>
</header>
<main>
  <div id="above">
    <p id="heard"></p>
    <p id="said" aria-live="polite"></p>
  </div>
  <section id="talk-area" hidden aria-label="이 기기의 입력">
    <div id="pads">
      <button type="button" class="pad" id="talk" aria-label="음성: 누르고 있는 동안 말하고, 떼면 보내요">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <span class="t" aria-hidden="true">음성</span>
      </button>
    </div>
  </section>
  <p class="note" id="talk-off" hidden>이 기기의 음성이 까치에게 닫혀 있어요. 까치 홈의 기기에서 열 수 있어요.</p>

  <div id="below">
    <div id="msg">
      <p id="status" role="status"></p>
      <button type="button" class="btn" id="update" hidden>새 버전이 있어요. 눌러서 새로고침</button>
      <p class="note" id="lock-note" hidden>이 기기는 화면 꺼짐을 막을 수 없어요. 설정에서 자동 잠금을 꺼 두세요.</p>
      <form id="setup" hidden>
        <input id="name-input" maxlength="40" placeholder="이 기기 이름 (예: 거실)" aria-label="이 기기 이름" required />
        <button type="submit" class="btn">시작</button>
      </form>
      <div id="start" hidden>
        <button type="button" class="btn" id="start-btn">탭해서 시작</button>
        <p class="note">소리와 마이크를 쓰려면 화면을 한 번 눌러야 해요.</p>
      </div>
    </div>
    <div id="dock">
      <button type="button" id="senses" hidden></button>
    </div>
  </div>
</main>

<button type="button" class="icon-btn" id="open-log" aria-label="기록" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg>
</button>
<dialog id="log" aria-labelledby="log-title">
  <form class="sheet" method="dialog">
    <div class="sheet-head"><h2 id="log-title">기록</h2><button class="text-btn" value="close">완료</button></div>
    <ul id="log-list"></ul>
    <p class="note">이 기기에서 있었던 일 최근 50개예요. 페이지를 새로 열면 비워져요.</p>
  </form>
</dialog>
<dialog id="settings" aria-labelledby="settings-title">
  <form class="sheet" method="dialog">
    <div class="sheet-head"><h2 id="settings-title">이 기기</h2><button class="text-btn" value="close">완료</button></div>
    <section id="caps" aria-label="이 기기로 할 수 있는 것">
      <div><h2>출력</h2><div class="grid" id="caps-in"></div></div>
      <div><h2>입력</h2><div class="grid" id="caps-out"></div></div>
    </section>
    <p class="note">까치가 무엇을 쓸지는 까치 홈에서 정해요. 여기는 지금 상태만 보여 줘요. 음성이 까치에게 열려 있으면 화면 가운데에 누르고 말하는 버튼이 나와요.</p>
  </form>
</dialog>
<div id="lamp" hidden><div id="lamp-dim"></div></div>
<video id="cam" playsinline muted></video>
<script>
const $ = (id) => document.getElementById(id);
const store = { get: (k) => localStorage.getItem("kkachi.device." + k), set: (k, v) => localStorage.setItem("kkachi.device." + k, v), del: (k) => localStorage.removeItem("kkachi.device." + k) };
const VERSION = "__PAGE_VERSION__"; // filled in by the server; it says "update" when this page is old
let ws = null, audio = null, wakeLock = null, retry = 0, joined = false, allowed = false;

// What this browser can do, sent to Kkachi on connect (the sensor checklist reads it too).
const features = () => ({
  camera: !!navigator.mediaDevices?.getUserMedia, microphone: !!navigator.mediaDevices?.getUserMedia,
  motion: "DeviceMotionEvent" in window, orientation: "DeviceOrientationEvent" in window,
  geolocation: "geolocation" in navigator, wakeLock: "wakeLock" in navigator, push: "PushManager" in window,
  ambientLight: "AmbientLightSensor" in window, proximity: "ProximitySensor" in window, battery: !!navigator.getBattery,
  vibrate: !!navigator.vibrate, nfc: "NDEFReader" in window, bluetooth: !!navigator.bluetooth,
});

function status(text, cls = "") { $("status").textContent = text; $("status").className = cls; }
const armed = () => audio?.state === "running";
function showReady() {
  const ready = allowed && armed();
  document.body.classList.toggle("ready", ready);
  $("talk-area").hidden = !(ready && isOn("talk") && !lampOn); // a lit lamp is only light: no button on it
  $("talk-off").hidden = !(ready && !isOn("talk"));
  $("open-settings").hidden = !allowed;
  $("open-log").hidden = !allowed;
  $("senses").hidden = !allowed;
  if (allowed) status(armed() ? "연결됨" : "연결됨. 화면을 한 번 눌러 주세요", "ok");
  renderCaps();
}

// ---- what this device can do for Kkachi, shown on screen so anyone in the room can see it ----
// Permission per sense: ok | tap (ask with the start tap) | denied | none (this browser cannot).
const f0 = features();
// A phone or a tablet, by its screen. Only a tablet can be a lamp: the lamp is the whole screen, and on
// a phone it lay over the talk pad and took its touches.
const FORM = Math.min(screen.width, screen.height) >= 600 ? "tablet" : "phone";
const perm = { mic: f0.microphone ? "tap" : "none", camera: f0.camera ? "tap" : "none", motion: f0.motion ? "tap" : "none", location: f0.geolocation ? "tap" : "none" };
const inUse = new Map(); // cap -> what it is doing now
let lampOn = false;
const icon = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const CAPS = [
  { key: "speak", to: "in", name: "스피커", icon: '<path d="M4 10v4h4l5 4V6L8 10H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/>', state: () => armed() ? "ok" : "tap" },
  { key: "light", to: "in", name: "조명", icon: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>', state: () => (FORM === "tablet" ? "ok" : "none"), ok: () => lampOn ? "비추는 중" : "켜짐" }, // the switch allows it; the words say whether it is lit
  { key: "talk", to: "out", name: "음성", icon: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>', state: () => armed() ? perm.mic : "tap" },
  { key: "camera", to: "out", name: "카메라", icon: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>', state: () => perm.camera },
  { key: "sound", to: "out", name: "소리 크기", icon: '<path d="M3 12h2M7 8v8M11 5v14M15 9v6M19 11v2"/>', state: () => armed() ? perm.mic : "tap" },
  { key: "sensors", to: "out", name: "가속도 센서", icon: '<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>', state: () => perm.motion },

async function toBase64(blob) {
  const bytes = new Uint8Array(await blob.arrayBuffer());
  let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
function flushOutbox() {
  const expired = outbox.filter((x) => Date.now() - x.at > INPUT_TTL);
  if (expired.length) { outbox = outbox.filter((x) => !expired.includes(x)); hint("까치에 전하지 못했어요. 다시 말해 주세요"); }
  if (ws?.readyState !== 1) return;
  for (const x of outbox) ws.send(JSON.stringify({ type: "input", id: x.id, kind: "talk", age: Date.now() - x.at, audio: x.audio, mime: x.mime }));
}
setInterval(flushOutbox, 5000);
const ACK_ERRORS = { "switched off": "음성이 꺼져 있어요", expired: "너무 늦게 도착해서 버렸어요. 다시 말해 주세요", "no agent": "들을 까치가 연결돼 있지 않아요" };
function onAck(m) {
  if (!outbox.some((x) => x.id === m.id)) return;
  outbox = outbox.filter((x) => x.id !== m.id);
  hint(m.ok ? "전했어요" : ACK_ERRORS[m.error] ?? "까치가 받지 못했어요");
}
// An answer comes in parts, a sentence each, while Kkachi is still writing it (part: 0, 1, …; last ends it
// and may carry the whole answer to leave on screen). They can arrive out of order, since each one's
// voice is made on its own: they are said by number, one after another. A message without a part is a
// whole answer.
let answer = { id: null, next: 0, parts: new Map(), saying: false, words: "" };
function onReply(m) {
  const part = Number.isInteger(m.part) ? m.part : 0, whole = !Number.isInteger(m.part);
  if (m.inputId !== answer.id) {
    answer = { id: m.inputId, next: 0, parts: new Map(), saying: false, words: "" };
    hint("누른 채로 말하고, 떼면 보내요");
    if (!m.heard) { $("heard").textContent = ""; hint("잘 못 들었어요. 다시 말해 주세요"); return; }
    $("heard").textContent = `“${m.heard}”`;
    $("said").textContent = ""; $("said").className = "";
  }
  if (part < answer.next || answer.parts.has(part)) return; // sent again after a reconnect
  answer.parts.set(part, whole ? { ...m, last: true } : m);
  sayParts(answer);
}
async function sayParts(a) {
  if (a.saying) return;
  a.saying = true;
  for (let m; a === answer && (m = a.parts.get(a.next)); a.next++) { // a newer answer takes over
    a.parts.delete(a.next);
    if (m.text) {
      a.words = a.words ? `${a.words} ${m.text}` : m.text;
      if (armed() && !m.quiet) { // quiet: this device's speaker is not open to Kkachi, the words only show
        setBusy("speak", "말하는 중");
        try { await speakOut({ ...m, text: a.words, say: m.text }); } catch {} finally { setBusy("speak", null); } // the words stay on screen
      } else { $("said").textContent = a.words; $("said").className = ""; }
    }
    if (m.last && m.show && a === answer) { $("said").textContent = m.show; $("said").className = ""; } // the answer, without what was said on the way to it
  }
  a.saying = false;
}

// 16 kHz mono 16-bit WAV, as Kkachi Home sends (src/web/app.js).
function encodeWav(frames, inRate, outRate) {
  const total = frames.reduce((n, f) => n + f.length, 0);
  const all = new Float32Array(total); let o = 0;
  for (const f of frames) { all.set(f, o); o += f.length; }
  const ratio = inRate / outRate, outLen = Math.floor(total / ratio);
  const pcm = new Int16Array(outLen);
  for (let i = 0; i < outLen; i++) {
    const s = Math.floor(i * ratio), e = Math.min(Math.floor((i + 1) * ratio), total);
    let acc = 0; for (let j = s; j < e; j++) acc += all[j];
    const v = Math.max(-1, Math.min(1, acc / Math.max(1, e - s)));
    pcm[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
  }
  const buf = new ArrayBuffer(44 + pcm.byteLength), d = new DataView(buf);
  const w = (p, s) => { for (let i = 0; i < s.length; i++) d.setUint8(p + i, s.charCodeAt(i)); };
  w(0, "RIFF"); d.setUint32(4, 36 + pcm.byteLength, true); w(8, "WAVE"); w(12, "fmt ");
  d.setUint32(16, 16, true); d.setUint16(20, 1, true); d.setUint16(22, 1, true);
  d.setUint32(24, outRate, true); d.setUint32(28, outRate * 2, true); d.setUint16(32, 2, true); d.setUint16(34, 16, true);
  w(36, "data"); d.setUint32(40, pcm.byteLength, true);
  new Int16Array(buf, 44).set(pcm);
  return new Blob([buf], { type: "audio/wav" });
}

$("talk").addEventListener("pointerdown", (e) => { e.preventDefault(); $("talk").setPointerCapture?.(e.pointerId); startTalking(); });
for (const ev of ["pointerup", "pointercancel"]) $("talk").addEventListener(ev, stopTalking);
$("talk").addEventListener("contextmenu", (e) => e.preventDefault()); // long press: no menu

function join() {
  joined = true;
  $("name").textContent = store.get("name");
  $("setup").hidden = true; $("start").hidden = false;
  showReady();
  status("연결하는 중…");
  connect();
}

$("setup").addEventListener("submit", (e) => { e.preventDefault(); store.set("name", $("name-input").value.trim()); join(); arm(); });
$("start-btn").addEventListener("click", arm);
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible") return;
  if (audio) await audio.resume().catch(() => {}); // iOS suspends audio in the background
  if (wakeLock?.released !== false) await keepAwake(); // the lock is released when the page is hidden
  $("start").hidden = armed() || !joined;
  sendState();
  showReady();
});

const preset = new URLSearchParams(location.search).get("name");
if (preset && !store.get("name")) store.set("name", preset);
if (store.get("name")) join();
else { $("setup").hidden = false; status("이 기기를 어디에 둘지 이름을 붙여 주세요."); $("name-input").focus(); }
</script>
